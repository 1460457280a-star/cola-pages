/* 皮肤：浅色 / 深色 / 薄荷，三态循环，localStorage 持久化，默认跟随系统 */
(function initTheme(){
  const SKINS = ['light','mint'];
  const NEXT_LABEL = { light:'🌱 薄荷', mint:'☀️ 浅色' };
  let saved = null;
  try { saved = localStorage.getItem('48hot-theme'); } catch(e){}
  if(!SKINS.includes(saved)) saved = null;
  const skin = saved || 'light';
  document.documentElement.setAttribute('data-skin', skin);
  const btn = document.getElementById('themeToggle');
  if(!btn) return;
  const cur = () => document.documentElement.getAttribute('data-skin');
  const label = () => { btn.textContent = NEXT_LABEL[cur()] || '☀️ 浅色'; };
  label();
  btn.addEventListener('click', () => {
    const i = SKINS.indexOf(cur());
    const next = SKINS[(i + 1) % SKINS.length];
    document.documentElement.setAttribute('data-skin', next);
    try { localStorage.setItem('48hot-theme', next); } catch(e){}
    label();
  });
})();

/* 栏目 tab 切换：一次只显示一个栏目（专栏式分页） */
(function tabs(){
  const links = Array.from(document.querySelectorAll('#tabs a'));
  const secs = links.map(a => document.getElementById(a.getAttribute('href').slice(1))).filter(Boolean);
  const show = id => {
    secs.forEach(s => s.classList.toggle('on', s.id === id));
    links.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#'+id));
  };
  links.forEach(a => a.addEventListener('click', e => {
    e.preventDefault();
    show(a.getAttribute('href').slice(1));
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }));
  if(secs.length) show(secs[0].id);
})();

  pageItems.forEach(x=>{ (by[x.date] ||= []).push(x); });
  const days = Object.keys(by).sort().reverse();
  let body = '';
  days.forEach(day=>{
    body += `<div class="day">${esc(day)}（${by[day].length} 条）</div>`;
    by[day].forEach(x=>{
      body += `<div class="news"><span class="ch ${esc(x.channel)}">${esc(CH_NAME[x.channel]||x.channel)}</span>` +
        (x.signal==='rumor' ? `<span class="tag v-low">瓜</span>` : ``) +
        (x.time ? `<span class="tag act">${esc(x.time)}</span>` : ``) +
        `<div class="h"><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a></div>` +
        (x.summary && x.summary !== x.title ? `<div class="d">${esc(x.summary)}</div>` : ``) +
        `<div class="d">${x.source ? esc(x.source)+' · ' : ''}<a class="u" href="${esc(x.url)}" target="_blank" rel="noopener">原文 ↗</a></div></div>`;
    });
  });
  if(!list.length) body = `<div class="empty">窗口内暂无动态</div>`;
  body += `<div class="pager">` +
    `<button class="pager-btn" data-pg="prev"${feedPage<=1?' disabled':''}>‹ 上一页</button>` +
    `<span class="pager-info">${feedPage} / ${totalPages} 页 · ${list.length} 条</span>` +
    `<button class="pager-btn primary" data-pg="next"${feedPage>=totalPages?' disabled':''}>下一页 ›</button>` +
    `</div>`;
  el.innerHTML = h + body;
  el.querySelectorAll('.cat-chip').forEach(b=>{
    b.addEventListener('click', ()=>{
      feedDays = Number(b.dataset.days);
      feedPage = 1;
      renderFeed();
    });
  });
  el.querySelectorAll('.pager-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      feedPage += b.dataset.pg==='prev' ? -1 : 1;
      renderFeed();
      el.scrollIntoView({ behavior:'smooth', block:'start' });
    });
  });
}

/* ---- 简报 ---- */
function renderBrief(){
  const el = document.getElementById('brief');
  const b = DATA.brief;
  let h = `<h2>今日简报</h2><p class="hint">${b.honest_line}</p>`;
  h += `<div class="grid2">`;
  // 热点
  h += `<div class="card"><div class="ttl">🔥 当前热点</div>`;
  (b.hot_topics||[]).forEach(t=>{
    h += `<div class="news"><span class="rank r${t.rank}">${t.rank}</span><span class="ttl">${esc(t.title)}</span>`+
         `<div class="why">${esc(t.why_hot)}</div></div>`;
  });
  h += `</div>`;
  // 事件进展
  h += `<div class="card"><div class="ttl">📌 事件最新进展</div>`;
  (b.event_updates||[]).forEach(e=>{
    h += `<div class="news"><span class="ttl">${esc(e.event)}</span> <span class="tag act">${e.item_count} 条</span>`+
         `<div class="why">${esc(e.latest)}</div></div>`;
  });
  h += `</div>`;
  h += `</div>`;
  el.innerHTML = h;
}

/* ---- 热点 ---- */
function renderHot(){
  const el = document.getElementById('hot');
  let h = `<h2>热点榜</h2><p class="hint">可解释热度信号（时效 + 事件聚合度 + 置顶），排名不冒充热度值，详见 README/docs。</p>`;
  const topics = DATA.hot_topics||[];
  const cardOf = (t, hero) => `<div class="card${hero?' hero':''}">`+
         `<div class="hot-head"><span class="rank r${t.rank}">${t.rank}</span><span class="ttl">${esc(t.title)}</span>`+
         `<span class="tag ${tierTag(t.tier)}">${t.tier}</span></div>`+
         `<div class="why">${esc(t.why_hot)}</div>`+
         `<div class="meta">最新 ${esc(t.latest_at)} · 事件 ${t.item_count} 条${t.has_top?' · 置顶':''}</div></div>`;
  if(topics[0]) h += cardOf(topics[0], true);
  const rest = topics.slice(1);
  if(rest.length) h += `<div class="grid2">` + rest.map(t=>cardOf(t,false)).join('') + `</div>`;
  if(!topics.length) h += `<div class="empty">窗口内暂无热点</div>`;
  el.innerHTML = h;
}

/* ---- 事件 ---- */
function renderStories(){
  const el = document.getElementById('stories');
  let h = `<h2>事件时间线</h2><p class="hint">散点新闻聚成事件链（启动 → 入围 → 名单 → 夺冠 → 落幕）。</p>`;
  (DATA.stories||[]).forEach(e=>{
    h += `<div class="card"><span class="ttl">${esc(e.title)}</span> `+
         `<span class="tag act">${e.item_count} 条</span>`+
         `<span class="meta">${esc(e.earliest_at)} ~ ${esc(e.latest_at)} · ${e.groups.map(g=>g.toUpperCase()).join(' / ')}</span>`+
         `<div class="tl">`;
    (e.milestones||[]).forEach(m=>{
      h += `<div class="node"><span class="dt">${esc(m.date)}</span><span class="ms">${esc(m.milestone)}</span><div>${esc(m.title)}</div></div>`;
    });
    h += `</div><div class="meta">最新：<a href="${esc(e.latest.url)}" target="_blank" rel="noopener">${esc(e.latest.line)} ↗</a></div></div>`;
  });
  if(!(DATA.stories||[]).length) h += `<div class="empty">暂无事件</div>`;
  el.innerHTML = h;
}

/* ---- 精选 ---- */
function renderCurated(){
  const el = document.getElementById('curated');
  const all = DATA.curated||[];
  const CATS = [['all','全部'],['3','资讯'],['1','公演公告'],['2','握手答谢'],['4','活动'],['5','辟谣'],['other','多团归并']];
  let curCat = 'all';
  const catOf = c => (c.catid==null ? 'other' : String(c.catid));
  const countOf = cat => cat==='all' ? all.length : all.filter(c=>catOf(c)===cat).length;
  const renderList = (list) => {
    const by = {};
    list.forEach(c=>{ (by[c.published_at] ||= []).push(c); });
    let out = '';
    Object.keys(by).sort().reverse().forEach(day=>{
      out += `<div class="day">${esc(day)}（${by[day].length} 条）</div>`;
      by[day].forEach(c=>{
        out += `<div class="news"><span class="tag ${tierTag(c.tier)}">${c.tier}</span><span class="tag grp">${esc(c.group)}</span>`+
               `<div class="h">${esc(c.title)}</div>`+
               `<div class="d">${esc(c.reason)}</div>`+
               `<div class="d"><a class="u" href="${esc(c.url)}" target="_blank" rel="noopener">原文 ↗</a></div></div>`;
      });
    });
    return out;
  };
  const renderBody = () => {
    const fp0 = all.filter(c=>c.tier==='P0' && (curCat==='all' || catOf(c)===curCat));
    const fp1 = all.filter(c=>c.tier!=='P0' && (curCat==='all' || catOf(c)===curCat));
    let out = '';
    if(fp0.length) out += `<div class="sec-ttl">🔴 P0 重点精选（${fp0.length} 条）</div>` + renderList(fp0);
    if(fp1.length) out += `<details class="fold"><summary>P1 常规精选（${fp1.length} 条，点击展开）</summary>` + renderList(fp1) + `</details>`;
    if(!fp0.length && !fp1.length) out += `<div class="empty">该分类下暂无精选</div>`;
    return out;
  };
  let h = `<h2>历史档案</h2><p class="hint">官网历史条目（2016–2019）· 排除政务公告/行政文、归并多团镜像后按 P0/P1 分级 · 默认折叠，展开后可分类浏览。</p>`;
  h += `<details class="fold"><summary>展开官网历史档案（${all.length} 条）</summary>`;
  h += `<div class="cats">` + CATS.map(([v,name])=>`<button class="cat-chip${v===curCat?' on':''}" data-cat="${v}">${name} ${countOf(v)}</button>`).join('') + `</div>`;
  h += `<div id="curated-body">` + renderBody() + `</div>`;
  h += `</details>`;
  el.innerHTML = h;
  el.querySelectorAll('.cat-chip').forEach(b=>{
    b.addEventListener('click', ()=>{
      curCat = b.dataset.cat;
      el.querySelectorAll('.cat-chip').forEach(x=>x.classList.toggle('on', x.dataset.cat===curCat));
      el.querySelector('#curated-body').innerHTML = renderBody();
    });
  });
}

/* ---- 厕所瓜 ---- */
function renderGua(){
  const el = document.getElementById('gua');
  const g = DATA.guapool || {guas:[]};
  let h = `<h2>厕所瓜</h2><p class="hint">${esc(g.disclaimer||'')}</p>`;
  (g.guas||[]).forEach(x=>{
    const vcls = x.verdict==='多源互证'?'ok':(x.verdict==='待验证'?'mid':'low');
    h += `<div class="card"><span class="ttl">${esc(x.member)}</span> <span class="tag v-${vcls}">${esc(x.verdict)}</span>`+
         (x.confirmed ? `<span class="tag v-ok">✓ 已证实</span>` : ``)+
         `<div class="meter"><div class="meter-bar" style="width:${x.heat}%"></div><span>热度 ${x.heat}/100</span></div>`+
         `<div class="meta">可信度 ${x.credibility}/100 · ${x.item_count} 条 · 源 ${(x.channels||[]).join(' / ')} · 最新 ${esc(x.latest_at)}</div>`;
    (x.confirmed_by||[]).forEach(c=>{
      h += `<div class="news" style="border-left-color:var(--green)"><div class="h">✔ 官方证实（${esc(c.event)}）：${esc(c.title)}</div>`+
           `<div class="d">${esc(c.published_at)} · <a class="u" href="${esc(c.url)}" target="_blank" rel="noopener">原文 ↗</a></div></div>`;
    });
    (x.items||[]).forEach(it=>{
      h += `<div class="news"><div class="h">${esc(it.title)}</div>`+
           `<div class="d">${esc(it.published_at)} · <a class="u" href="${esc(it.url)}" target="_blank" rel="noopener">原文 ↗</a></div></div>`;
    });
    h += `</div>`;
  });
  if(!(g.guas||[]).length) h += `<div class="empty">当前窗口暂无厕所瓜（可能真没有，也可能瓜帖已沉，见 docs/guapool.md）</div>`;
  el.innerHTML = h;
}
