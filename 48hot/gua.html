/* ===== 48日报 · 体育报纸版式（2026-09-11 改版）=====
   参照体育报纸的阅读习惯：报头双线 + 期号反白 / 栏目头用色块 / 正文与榜单左右分栏 /
   积分榜大号名次 / 底部「人事动态」栏。只使用既有 token，不引入外部模板色。 */
/* 报头布局与配色在下方 `.editorial-main .rp-masthead` 段定义（首页是唯一有日报的页面）；
   这里只放期号徽标的默认样式与数据条/分栏等新栏目。 */
.rp-edition{display:inline-flex; align-items:center; background:var(--ink); color:var(--card-bg);
  font-size:11.5px; font-weight:900; letter-spacing:.1em; padding:3px 9px; border-radius:3px; margin-right:8px}
.rp-databar{display:grid; grid-template-columns:repeat(auto-fit,minmax(84px,1fr)); border-bottom:1px solid var(--line); margin:0 0 9px}
.rp-data{border-right:1px solid var(--line); padding:6px 10px 7px 0; min-width:0}
.rp-data:last-child{border-right:0}
.rp-data b{display:block; font-size:clamp(16px,1.7vw,21px); font-weight:900; line-height:1;
  font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.rp-data b i{font-style:normal; font-size:.45em; font-weight:800; color:var(--muted); margin-left:3px}
.rp-data span{display:block; margin-top:2px; font-size:10px; color:var(--muted); letter-spacing:.08em; font-weight:700}
.rp-lead{grid-template-columns:minmax(0,1fr) minmax(210px,300px); gap:24px; margin:16px 0 0;
  padding-bottom:16px; border-bottom:1px solid var(--line)}
.rp-kicker{font-size:11.5px; letter-spacing:.14em; border-left:3px solid var(--accent); padding-left:8px; margin-bottom:9px}
.rp-headline{font-size:clamp(23px,3.2vw,36px); font-weight:900; line-height:1.22; letter-spacing:-.015em; margin-bottom:10px}
.rp-summary{font-size:14px; -webkit-line-clamp:4}
.rp-sec{display:flex; align-items:baseline; gap:8px; font-size:13.5px; font-weight:900; letter-spacing:.06em;
  border-bottom:2px solid var(--ink); padding:0 0 4px; margin:11px 0 6px}
.rp-sec::before{content:""; width:9px; height:9px; background:var(--accent); transform:translateY(-2px)}
.rp-sec em{font-style:normal; font-size:10px; font-weight:800; letter-spacing:.18em; color:var(--muted)}
/* 主体两栏：左正文 / 右榜单。窄屏切单列时必须用 minmax(0,1fr)，
   否则 1fr 的 min 是 min-content，会被长数字串撑破容器（实测 492 > 472）。 */
.rp-body{display:grid; grid-template-columns:minmax(0,1.62fr) minmax(248px,.38fr); gap:0; min-width:0}
.rp-main{min-width:0; padding-right:16px}
.rp-aside{min-width:0; border-left:1px solid var(--line); padding-left:16px}
/* 时间线的「补高余量」：渲染后按实测的两栏高度差决定放出或回收 */
.rp-extra{display:none}
.rp-board-row{display:grid; grid-template-columns:22px minmax(0,1fr); gap:7px; align-items:start;
  padding:4px 0; border-bottom:1px dotted var(--line)}
.rp-board-row:last-child{border-bottom:0}
.rp-board-rank{font-size:16px; font-weight:900; line-height:1.15; color:var(--accent-deep); font-variant-numeric:tabular-nums}
.rp-board-main{min-width:0}
.rp-board-t{font-size:13px; font-weight:800; line-height:1.4}
.rp-board-w{font-size:11px; color:var(--muted); line-height:1.45; margin-top:2px}
.rp-move{display:grid; grid-template-columns:minmax(0,auto) minmax(0,1fr); gap:7px; align-items:baseline;
  padding:4px 0; border-bottom:1px dotted var(--line); font-size:12.5px}
.rp-move:last-child{border-bottom:0}
.rp-move-k{font-size:11px; font-weight:900; letter-spacing:.06em; color:var(--card-bg); background:var(--accent-deep);
  padding:2px 6px; border-radius:3px; white-space:nowrap}
.rp-move-t{min-width:0; line-height:1.5}
.rp-move-t b{font-weight:800}
.rp-move-d{display:block; font-size:11px; color:var(--muted); margin-top:2px}
@media(max-width:1100px){
  .rp-body{grid-template-columns:minmax(0,1fr)}
  .rp-main,.rp-aside{max-width:100%}
  .rp-main{padding-right:0}
  .rp-aside{border-left:0; border-top:1px solid var(--line); padding-left:0; padding-top:4px}
}
@media(max-width:767px){
  .rp-masthead{grid-template-columns:1fr}
  .rp-sub{text-align:left}
  .rp-databar{grid-template-columns:1fr 1fr}
  .rp-data:nth-child(2n){border-right:0}
}
footer{max-width:1120px; margin:0 auto; padding:8px 20px 44px; width:100%; color:var(--muted); font-size:12.5px}
footer a{color:var(--muted)}
.site-health{display:flex; flex-wrap:wrap; gap:5px 14px; margin-bottom:7px; font-variant-numeric:tabular-nums}
.site-health span{white-space:nowrap}
.site-health .degraded{color:var(--amber)}
.bsz-row{display:flex; flex-wrap:wrap; gap:5px 14px; margin-top:6px; font-variant-numeric:tabular-nums}
.bsz{white-space:nowrap}
.bsz b{font-weight:800; color:var(--ink)}
.about p{font-size:14px; color:var(--ink)}
.about table{border-collapse:collapse; width:100%; font-size:13px; margin-top:8px}
.about th,.about td{border:1px solid var(--line); padding:7px 10px; text-align:left}
.about th{background:var(--tag-soft)}
.empty{color:var(--muted); padding:20px 0; text-align:center}
.meter{display:flex; align-items:center; gap:8px; margin:8px 0 4px}
.meter-bar{height:8px; background:var(--meter-grad); border-radius:4px; min-width:2px}
.meter span{font-size:11px; color:var(--muted)}
.tag.v-ok{background:var(--v-ok-bg); color:var(--green)}
.tag.v-mid{background:var(--v-mid-bg); color:var(--amber)}
.tag.v-low{background:var(--v-low-bg); color:var(--p0)}
details.fold{border:1px solid var(--line); border-radius:10px; margin:12px 0; padding:6px 14px}
details.fold summary{cursor:pointer; font-weight:600; color:var(--accent-deep); padding:8px 0; font-size:14px; user-select:none}
details.fold summary:hover{text-decoration:underline}
details.fold[open] summary{margin-bottom:4px; border-bottom:1px solid var(--line)}
.body-txt{white-space:pre-wrap; font-size:13px; color:var(--ink); margin:6px 0 2px; line-height:1.7; max-height:320px; overflow-y:auto}
.sec-ttl{font-weight:700; font-size:15px; margin:14px 0 8px; color:var(--ink)}
.cats{display:flex; flex-wrap:wrap; gap:8px; margin:12px 0}
.cat-chip{appearance:none; border:1px solid var(--line); background:var(--card-bg); color:var(--muted);
  cursor:pointer; padding:5px 13px; border-radius:999px; font-size:13px; font-weight:600;
  transition:transform var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out)}
.cat-chip:hover{border-color:var(--accent); color:var(--accent)}
.cat-chip.on{background:var(--accent); border-color:var(--accent); color:#fff}
.cat-chip:active,.theme-toggle:active{transform:scale(0.97)}
.pick-cat{margin:18px 0 6px}
.pick-name{font-size:16px; font-weight:700; margin:4px 0 2px}
.pick-desc{color:var(--muted); font-size:13px; margin:0 0 10px}
.pick-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px}
.pick-card{display:flex; flex-direction:column; gap:6px; padding:14px 16px; border:1px solid var(--line);
  border-radius:12px; background:var(--card-bg); text-decoration:none; color:var(--ink);
  transition:transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out)}
.pick-card:hover{transform:translateY(-2px); border-color:var(--accent); box-shadow:var(--card-shadow)}
.pick-title{font-weight:700; font-size:15px; color:var(--ink)}
.pick-why{font-size:12.5px; color:var(--muted); line-height:1.5}
/* 应援日历（生日档案） */
.cal-stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(128px,1fr)); gap:10px; margin:14px 0 6px}
.cal-stat{border:1px solid var(--line); border-radius:var(--card-radius); background:var(--card-bg); padding:12px 14px}
.cal-stat b{display:block; font-size:20px; letter-spacing:-.02em; line-height:1.35}
.cal-stat span{font-size:12px; color:var(--muted)}
.cal-today{border:1px solid var(--accent); background:var(--accent-soft); border-radius:var(--card-radius); padding:14px 16px; margin:14px 0 6px}
.cal-today strong{font-size:15px}
.cal-today p{margin:6px 0 0; font-size:13.5px; line-height:1.75}
.cal-days{display:flex; flex-direction:column; gap:6px; margin:10px 0 4px}
.cal-day{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 10px; padding:8px 13px; border:1px solid var(--line); border-radius:var(--card-radius); background:var(--card-bg); font-size:12.5px; color:var(--muted)}
.cal-day b{font-size:13.5px; color:var(--ink); font-variant-numeric:tabular-nums}
.cal-when{color:var(--accent); font-weight:700; white-space:nowrap}
.cal-names{line-height:1.75}
.cal-month{border:1px solid var(--line); border-radius:var(--card-radius); background:var(--card-bg); margin-bottom:8px; padding:0 14px}
.cal-month summary{display:flex; align-items:baseline; gap:10px; padding:13px 2px; cursor:pointer; font-weight:800; font-size:14.5px}
.cal-month-count{font-weight:400; font-size:12.5px; color:var(--muted)}
.cal-month .pick-grid{padding-bottom:14px}
.cal-bars{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 4px}
.cal-bar{padding:4px 11px; border-radius:var(--radius-pill); background:var(--stone-100); color:var(--muted); font-size:12px}
.cal-note{font-size:12.5px; color:var(--muted); line-height:1.8; margin:10px 0 0}
/* 入河手册 */
.guide-disclaimer{border:1px solid var(--line); border-left:3px solid var(--amber); border-radius:0 var(--card-radius) var(--card-radius) 0; background:var(--card-bg); padding:12px 16px; margin:14px 0 4px; font-size:13px; color:var(--muted); line-height:1.8}
.guide-block{margin:26px 0 8px}
.guide-block h3{font-size:17px; margin:0 0 2px}
.guide-block > p{color:var(--muted); font-size:13px; margin:0 0 12px; line-height:1.7}
.guide-term{border:1px solid var(--line); border-radius:var(--card-radius); background:var(--card-bg); padding:14px 16px; margin-bottom:10px}
.guide-term b{display:block; font-size:15px; margin-bottom:3px}
.guide-term p{margin:0; font-size:13.5px; color:var(--muted); line-height:1.75}
.guide-src{display:inline-block; margin-top:7px; font-size:11.5px; color:var(--stone-400)}
.guide-block.redline h3{color:var(--red-600)}
.guide-warn{border:1px solid var(--line); border-left:4px solid var(--red-600); background:var(--red-chip); border-radius:0 var(--card-radius) var(--card-radius) 0; padding:13px 16px 13px 18px; margin-bottom:10px}
.guide-warn b{display:block; font-size:14.5px; margin-bottom:2px; color:var(--red-600)}
.guide-warn b::before{content:"红线 · "; font-weight:800}
.guide-warn p{margin:0; font-size:13px; line-height:1.75}
.guide-sources{margin:8px 0 0; padding-left:20px; color:var(--muted); font-size:12.5px; line-height:1.9}
.search-bar{display:flex; gap:10px; margin:10px 0 6px; align-items:center}
.search-input{flex:1; min-width:0; padding:13px 16px; font-size:15px; font-family:inherit;
  border:1px solid var(--line); border-radius:12px; background:var(--card-bg); color:var(--ink);
  transition:border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out)}
.search-input::placeholder{color:var(--muted)}
.search-input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.search-hint{color:var(--muted); font-size:12.5px; min-height:18px; margin:4px 0 6px}
.search-alias{display:inline-block; font-size:11px; padding:2px 8px; border-radius:6px; background:var(--violet-100); color:var(--violet-700); margin-right:6px}
.search-count{font-size:13px; font-weight:700; color:var(--muted); margin:14px 0 6px}
/* ===== 桌面端：侧边导航 + 内容区（pad / PC）===== */
@media(min-width:768px){
  .app{display:grid; grid-template-columns:240px minmax(0,1fr); grid-template-rows:auto 1fr auto; align-items:start}
  header{grid-column:2; grid-row:1; padding:18px 0 12px}
  header .wrap{max-width:1440px; padding:0 24px}
  header .brand{display:none}
  header .hero-slogan{display:none}
  header .header-row{justify-content:flex-end}
  header .badges{margin-top:0}
  header .src{margin-top:4px}
  .sidebar{grid-column:1; grid-row:1 / 4; align-self:start; position:sticky; top:0; height:100vh; overflow-y:auto;
    display:flex; flex-direction:column; gap:4px; background:var(--bg); border-right:1px solid var(--line); padding:22px 14px 20px}
  .side-brand{display:flex; flex-direction:column; gap:3px; padding:2px 12px 18px; margin-bottom:6px; border-bottom:1px solid var(--line); text-decoration:none; color:var(--ink)}
  .side-brand:hover{text-decoration:none}
  .side-brand b{font-size:28px; font-weight:800; letter-spacing:-.03em; line-height:1}
  .side-brand span{font-size:11.5px; color:var(--muted); line-height:1.5}
  nav.tabs{position:static; margin:0; max-width:none; width:100%; border:0; border-radius:0; box-shadow:none; background:transparent; backdrop-filter:none; -webkit-backdrop-filter:none; flex-direction:column; align-items:stretch; overflow:visible}
  .signal-nav .nav-inner{display:flex; flex-direction:column; width:100%; min-width:0; margin:0; padding:0}
  nav.tabs a{display:block; padding:10px 12px; border:0; border-left:3px solid transparent; border-radius:9px; font-size:14px; font-weight:600}
  nav.tabs a:hover{background:var(--tag-soft); color:var(--ink)}
  nav.tabs a.on{color:var(--accent); border-left-color:var(--accent); background:var(--accent-soft)}
  .side-foot{display:flex; flex-direction:column; gap:4px; margin-top:auto; padding:14px 12px 0; border-top:1px solid var(--line); font-size:11px; color:var(--muted); line-height:1.5}
  .side-foot span{display:block}
  main{grid-column:2; grid-row:2; width:100%; max-width:1440px; justify-self:center; margin:0; padding:4px 24px 0}
  footer{grid-column:2; grid-row:3; width:100%; max-width:1440px; justify-self:center; margin:0; padding:8px 24px 36px}
}
@media (prefers-reduced-motion: reduce){
  .card,.cat-chip,.theme-toggle{transition:none}
  .card:hover{transform:none; box-shadow:var(--card-shadow)}
}
@media(max-width:767px){
  .rp-dates{max-height:150px; overflow-y:auto}
  .rp-lead{grid-template-columns:1fr}
  .rp-figure img{aspect-ratio:4/3; max-height:320px}
  .rp-item,.rp-item-with-image{grid-template-columns:38px minmax(0,1fr) 56px}
  .rp-item .rp-time{grid-column:1 / 2}
  .rp-item .ch{grid-column:2 / 3}
  .rp-item .rp-t{grid-column:2 / 3}
  .rp-item .rp-thumb{grid-column:3 / 4; grid-row:1 / 3}
  .rp-item .rp-m{grid-column:2 / 3}
  .rp-extra-cols{grid-template-columns:1fr}
  .hot-lead .ttl{font-size:28px}
  .hot-row{grid-template-columns:38px minmax(0,1fr)}
  .hot-row .meta{grid-column:2; text-align:left; white-space:normal}
  .member-index{grid-template-columns:repeat(2,minmax(0,1fr))}
  nav.tabs{margin:-8px 0 8px; max-width:100%; border-radius:14px; flex-wrap:wrap; justify-content:center; overflow:visible}
  nav.tabs a{padding:6px 8px; font-size:11.5px}
  header{padding:28px 0 14px}
  .brand{gap:8px}
  .brand h1{font-size:28px}
  .brand .sub{font-size:11px}
  .hero-slogan,.badges{display:none}
  header .src{margin-top:8px; font-size:10.5px}
  section{padding:24px 0}
}
@media(max-width:640px){
  .brand h1{font-size:38px}
  .news-with-media{grid-template-columns:84px minmax(0,1fr); gap:10px}
  .news-thumb{width:84px}
  .layout-select{font-size:12px; padding-left:10px; padding-right:27px}
}

/* ===== ④ SIGNAL DESK · Manus-inspired editorial shell ===== */
.signal-hero{min-height:clamp(580px,78vh,780px); display:flex; align-items:flex-end; padding:72px 0 78px; background:var(--hero-field); position:relative; overflow:hidden}
.signal-hero::before{content:""; position:absolute; inset:0; background:linear-gradient(90deg,rgba(10,3,7,.72),transparent 65%), repeating-linear-gradient(90deg,transparent 0 88px,rgba(255,255,255,.045) 89px,transparent 90px); pointer-events:none}
.signal-hero::after{content:"48"; position:absolute; right:4vw; bottom:-.2em; font:900 clamp(280px,38vw,620px)/.7 Arial,sans-serif; letter-spacing:-.12em; color:rgba(255,255,255,.055); pointer-events:none}
.signal-hero .wrap{position:relative; z-index:1; width:100%}
.signal-kicker{display:flex; align-items:center; gap:12px; color:var(--coral); font:700 11px/1.2 Arial,"Microsoft YaHei",sans-serif; letter-spacing:.16em; text-transform:uppercase}
.signal-kicker::before{content:"✦"; color:var(--mint); font-size:18px}
.signal-title{max-width:920px; margin:30px 0 18px; color:#fff; font:900 clamp(52px,8vw,96px)/.92 Arial,"Microsoft YaHei",sans-serif; letter-spacing:-.035em}
.signal-title em{font-style:normal; color:var(--coral)}
.signal-deck{max-width:560px; margin:0; color:rgba(255,255,255,.72); font-size:17px; line-height:1.8}
.signal-actions{display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-top:34px}
.signal-cta{display:inline-flex; align-items:center; gap:12px; padding:13px 18px; color:#fff; background:var(--coral); border:1px solid var(--coral); font-weight:800; text-decoration:none; transition:transform var(--dur-normal) var(--ease-out),background var(--dur-normal) var(--ease-out)}
.signal-cta:hover{color:#fff; text-decoration:none; transform:translateY(-2px); background:var(--rose-200)}
.signal-cta.secondary{background:transparent; border-color:rgba(255,255,255,.3); color:#fff}
.signal-cta.secondary:hover{background:rgba(255,255,255,.1)}
.signal-readout{display:grid; grid-template-columns:repeat(3,minmax(100px,1fr)); gap:22px; max-width:650px; margin-top:58px; padding-top:18px; border-top:1px solid rgba(255,255,255,.22)}
.signal-readout b{display:block; color:#fff; font:700 21px/1.15 Arial,"Microsoft YaHei",sans-serif}
.signal-readout span{display:block; margin-top:5px; color:rgba(255,255,255,.52); font-size:11px; letter-spacing:.12em; text-transform:uppercase}
.signal-scroll{position:absolute; right:28px; bottom:24px; z-index:1; color:rgba(255,255,255,.56); font:11px/1 Arial,"Microsoft YaHei",sans-serif; letter-spacing:.16em; writing-mode:vertical-rl}
.signal-nav{width:100%; max-width:100vw; min-width:0; position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:0; overflow-x:auto; overflow-y:hidden; background:rgba(26,5,14,.96); border-bottom:1px solid rgba(255,255,255,.14); box-shadow:0 8px 24px rgba(12,2,7,.16)}
.signal-nav .nav-inner{display:flex; width:max-content; min-width:max-content; margin:0 auto; padding:0 24px}
.signal-nav a{position:relative; display:inline-flex; flex:0 0 auto; align-items:center; min-height:58px; padding:0 17px; color:rgba(255,255,255,.62); font-size:12px; font-weight:800; letter-spacing:.08em; text-decoration:none}
.signal-nav a::before{content:""; width:5px; height:5px; margin-right:8px; border:1px solid var(--coral); transform:rotate(45deg)}

/* 导航分两组：常读 5 项 + 档案与工具 11 项（现役指数按产品原则不进导航）。
   display:contents 让分组容器不参与布局，子项直接成为 .nav-inner 的 flex 项，
   桌面纵向侧栏与移动端横向换行条因此都不需要各写一套方向。 */
.nav-group{display:contents}
.nav-group-label{flex:0 0 auto; align-self:center; margin:0 6px; padding:0 4px; color:rgba(255,255,255,.45); font-size:10.5px; font-weight:800; letter-spacing:.14em; white-space:nowrap}

.skip-link:focus{transform:translateY(0)}
.editorial-main section:empty{display:none}
.editorial-main{background:var(--stone-50)}

.editorial-main section h2::before{width:7px; height:.8em; border-radius:0; background:var(--coral)}
.editorial-main section .hint{max-width:680px; font-size:15px; line-height:1.8}

.editorial-main .rp-title{font-size:clamp(21px,2.4vw,29px)}
/* 「48日报」原本用 rose-700，压在深红渐变报头上几乎不可读；改用浅粉保证对比度 */
.editorial-main .rp-title em{color:var(--rose-200); font-size:.6em; letter-spacing:.06em}
.editorial-main .rp-edition{background:rgba(0,0,0,.35); color:#fff; border:1px solid rgba(255,255,255,.35)}
.editorial-main .rp-chip{border-radius:0}
.editorial-main .rp-lead{grid-template-columns:minmax(0,1fr) minmax(150px,188px); gap:18px; padding:10px 0 12px}

.editorial-main .rp-figure img{border-radius:0; border:0}
.editorial-main .rp-sec{font-size:11px; letter-spacing:.18em; text-transform:uppercase; border-left:0; border-bottom:2px solid var(--rose-900); padding:0 0 4px}
/* 日报内部是连续版面，不是首页那种整屏板块：清掉 section 的 92/76px 上下留白与斑马底色。
   这一条是本版最关键的瘦身 —— 日报里有 5 个 section，各自白背 168px，合计虚胖约 800px。 */
.editorial-main .report section{padding:0; min-height:0; border-bottom:0;
  margin-left:0; margin-right:0; background:transparent; scroll-margin-top:0}
.editorial-main .report section:nth-of-type(even){margin-left:0; margin-right:0; padding-left:0; padding-right:0; background:transparent}
/* 报纸正文靠文字密度与规则线分栏，不靠底色：条目不带背景；
   头条图压到 124px，避免一张配图把正文挤出首屏；榜单标题最多两行。 */
.editorial-main .rp-view-item,.editorial-main .rp-item,.editorial-main .rp-board-row,.editorial-main .rp-move{background:transparent}
.editorial-main .rp-figure img{max-height:124px; aspect-ratio:16/9; object-fit:cover; object-position:top center}
.editorial-main .rp-figure figcaption{font-size:10.5px; margin-top:4px; line-height:1.35}
.editorial-main .rp-board-t{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
/* 榜单标题在 button 上直接限两行（外层 span 的 line-clamp 对内部的 button 不生效） */
.editorial-main .rp-board-t .jump-link,.editorial-main .rp-move-t .jump-link{text-align:left;
  font-size:13px; font-weight:800; line-height:1.4;

/* 报纸版式有大量短列与长英文/数字串（SNH482026、话题标签、日期），
   必须允许任意断行并放开网格项最小宽度，否则窄屏会被 min-content 撑破。 */
.editorial-main .rp-main,.editorial-main .rp-aside{min-width:0; max-width:100%}
.editorial-main .rp-t,.editorial-main .rp-view-t,.editorial-main .rp-board-t,
.editorial-main .rp-move-t,.editorial-main .rp-m,.editorial-main .rp-view-m,

/* 窄屏：头条改单栏（否则 220px 图列会撑出横向滚动），数据条两列，头条图限高 */

/* 档案编号：只用排版与边框建立秩序（Evidence Color Rule：红色不表示真假） */
.acc-code{display:inline-flex; align-items:center; gap:7px; padding:3px 8px; border:1px solid var(--line); border-radius:6px; background:var(--tag-soft); color:var(--stone-700); font:800 11px/1.4 Arial,"Microsoft YaHei",sans-serif; letter-spacing:.1em; white-space:nowrap}
.acc-code b{color:var(--ink); letter-spacing:.05em}
.on-dark .acc-code{border-color:rgba(255,255,255,.22); background:rgba(255,255,255,.08); color:rgba(255,255,255,.66)}
.on-dark .acc-code b{color:#fff}

/* 首页第一视口：今日发现卷宗（Persuade-to-Discover） */
.hero-proof-head{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.hero-proof-actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:20px}
.ghost-btn{appearance:none; display:inline-flex; align-items:center; gap:7px; padding:8px 13px; border:1px solid rgba(255,255,255,.32); border-radius:9px; background:transparent; color:#fff; font:700 13px/1.2 Arial,"Microsoft YaHei",sans-serif; cursor:pointer; text-decoration:none; transition:background var(--dur-fast) var(--ease-out),transform var(--dur-fast) var(--ease-out)}
.ghost-btn:hover{background:rgba(255,255,255,.13); color:#fff; text-decoration:none}
.ghost-btn.solid{background:var(--coral); border-color:var(--coral); color:#2b0610}
.ghost-btn.solid:hover{background:var(--rose-200); border-color:var(--rose-200); color:#2b0610}
.ghost-btn:active{transform:translateY(1px)}
.hero-proof-note{margin:14px 0 0; color:rgba(255,255,255,.5); font-size:11px; line-height:1.7}

/* 卷宗证据行：状态与来源先于标题（纸面档案区） */
.dossier-row-main{display:flex; flex-direction:column; gap:5px}
.dossier-row-top{display:flex; align-items:center; gap:9px; flex-wrap:wrap}
.dossier-row-sum{color:var(--muted); font-size:12.5px; line-height:1.7}
.dossier-row-src{display:flex; align-items:center; gap:10px; flex-wrap:wrap; color:var(--muted); font-size:11px}
.dossier-row-acts{display:flex; flex-direction:column; align-items:stretch; gap:6px; min-width:104px}
.dossier-row-acts .archive-btn{min-height:32px; padding:6px 10px; font-size:12px}

/* 共建接收台：工序步进 + 真实接收状态 + 诚实边界 */
.intake-step em{display:block; margin-bottom:7px; font:800 11px/1 Arial,"Microsoft YaHei",sans-serif; font-style:normal; letter-spacing:.16em; color:var(--accent)}
.intake-step b{font-size:15px}
.intake-step span,.home-slice-row span:not(.status-badge){color:var(--stone-700)}
html[data-skin="dark"] .intake-step span,html[data-skin="dark"] .acc-code,html[data-skin="dark"] .home-slice-row span:not(.status-badge){color:#e2d5cf}
.intake-status{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); margin:30px 0 0; border:1px solid var(--line); border-radius:var(--radius-card); background:var(--card); overflow:hidden}
.intake-status div{padding:16px 18px; border-left:1px solid var(--line)}
.intake-status div:first-child{border-left:0}
.intake-status b{display:block; font-size:24px; font-weight:900; letter-spacing:-.03em}
.intake-status span{display:block; margin-top:5px; color:var(--muted); font-size:12px; line-height:1.65}
.honest-note{margin:20px 0 0; padding:15px 17px; border:1px solid var(--line); border-radius:var(--radius-card); background:var(--tag-soft); color:var(--muted); font-size:12.5px; line-height:1.8}
.honest-note strong{display:block; margin-bottom:5px; color:var(--ink); font-size:12px; letter-spacing:.1em; text-transform:uppercase}
.source-guide{margin:26px 0 0; padding:18px 20px; border:1px solid var(--line); border-radius:var(--radius-card); background:var(--card)}
.source-guide h3{margin:0 0 6px; font-size:16px; letter-spacing:-.02em}
.source-guide p{margin:0 0 14px; color:var(--muted); font-size:12.5px; line-height:1.7}
.source-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px}
.source-item{padding:12px 14px; border:1px solid var(--line); border-radius:9px; background:var(--tag-soft)}
.source-item b{display:flex; align-items:center; gap:8px; margin-bottom:5px; font-size:13px; color:var(--ink)}
.source-item span{display:block; color:var(--muted); font-size:12px; line-height:1.6}
.source-item code{font-size:11px; color:var(--accent); font-family:inherit}
.community-slices{margin-top:26px}
.community-slices h3{margin:0 0 4px; font-size:17px}
.community-slices p{margin:0 0 10px; color:var(--muted); font-size:12.5px}

/* 可分享切片带（横向、平放，只有动作抬升） */
.slice-strip{display:flex; gap:12px; margin-top:14px; padding:2px 0 14px; overflow-x:auto; scroll-snap-type:x proximity}
.slice-strip-item{flex:0 0 min(268px,74vw); display:flex; flex-direction:column; gap:9px; padding:15px 16px; border:1px solid var(--line); border-radius:var(--radius-card); background:var(--card); scroll-snap-align:start; transition:border-color var(--dur-fast) var(--ease-out),box-shadow var(--dur-fast) var(--ease-out)}
.slice-strip-item:hover{border-color:var(--accent); box-shadow:var(--shadow-md)}
.slice-strip-type{font:800 11px/1 Arial,"Microsoft YaHei",sans-serif; letter-spacing:.14em; text-transform:uppercase; color:var(--accent)}
.slice-strip-title{font-size:14px; font-weight:700; line-height:1.55; color:var(--ink)}
.slice-strip-note{color:var(--muted); font-size:11.5px; line-height:1.65}
.slice-strip-foot{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:auto; padding-top:10px; border-top:1px solid var(--line); color:var(--muted); font-size:11px}

/* 首页第二折叠：接收台与轮换池 */
.home-fold{margin-bottom:48px; padding-bottom:34px; border-bottom:2px solid var(--ink)}
.home-fold-head{display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:6px}
.home-fold-head h3{margin:0; font-size:26px; letter-spacing:-.03em}
.home-fold-head p{margin:0; color:var(--muted); font-size:13px; max-width:62ch; line-height:1.8}
.rotation-list{margin-top:14px; border-top:1px solid var(--line)}
.rotation-row{display:grid; grid-template-columns:118px minmax(0,1fr) auto; gap:14px; align-items:center; padding:11px 0; border-bottom:1px solid var(--line); font-size:13px}
.rotation-row b{font-weight:800; color:var(--ink)}
.rotation-row > span:not(.acc-code){color:var(--muted); font-size:12px}
.home-slice-row .status-badge{grid-column:2}

@media(max-width:767px){
  body.page-home .signal-hero{padding:34px 18px 36px; min-height:0}

}

}

const compactTitle = (value, limit = 58) => {
  const plain = String(value || '')
    .replace(/#[^#\n]{1,42}#/g, ' ')
    .replace(/[\u200b\u200c\u200d]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
  return plain.length > limit ? plain.slice(0, limit).trimEnd() + '…' : plain;
};
const stableHash = value => {
  let hash = 2166136261;
  for(const char of String(value || '')){ hash ^= char.charCodeAt(0); hash = Math.imul(hash, 16777619); }
  return hash >>> 0;
};

const CH_NAME = { official:'官网', bilibili:'B站', 'bilibili-bej':'BEJ48', 'bilibili-gnz':'GNZ48', 'bilibili-cgt':'CGT48', weibo:'微博', 'weibo-super':'超话', media:'媒体', msg48:'口袋48/msg48', tieba:'贴吧', 'tieba-hg':'生个女孩吧', 'tieba-gnz':'GNZ48吧', 'tieba-bej':'BEJ48吧', 'tieba-ckg':'CKG48吧', 'tieba-cgt':'CGT48吧', 'tieba-sh':'塞纳河48吧', douban:'豆瓣' };
let feedDays = 7;

const FEED_PAGE_SIZE = 20;
let feedLinkResolved = false;
function renderFeed(){
  const el = document.getElementById('feed');
  const F = DATA.feed || {};

  const all30 = F.days30 || [];

  if(!feedLinkResolved){
    const target = news30.findIndex(item => '#feed-' + stableHash(item.url) === location.hash);
    if(target >= 0){ feedDays = 30; feedPage = Math.floor(target / FEED_PAGE_SIZE) + 1; }
    feedLinkResolved = true;
  }
  const list = feedDays===7 ? news7 : news30;
  let h = `<h2>今日动态</h2><p class="hint">近 ${feedDays} 天已核实动态 · 时间倒序 · 来源：官网 / B站 / 微博 / 媒体。贴吧/豆瓣讨论与瓜料见「厕所瓜」。</p>`;

    `<button class="cat-chip${feedDays===7?' on':''}" data-days="7">近 7 天（${news7.length} 条）</button>` +
    `<button class="cat-chip${feedDays===30?' on':''}" data-days="30">近 30 天（${news30.length} 条）</button>` +
    `</div>`;
  const totalPages = Math.max(1, Math.ceil(list.length / FEED_PAGE_SIZE));
  if(feedPage > totalPages) feedPage = totalPages;
  const start = (feedPage-1)*FEED_PAGE_SIZE;
  const pageItems = list.slice(start, start+FEED_PAGE_SIZE);
  const by = {};
  pageItems.forEach(x=>{ (by[x.date] ||= []).push(x); });
  const days = Object.keys(by).sort().reverse();
  let body = '';
  days.forEach(day=>{
    body += `<div class="day">${esc(day)}（${by[day].length} 条）</div>`;
    by[day].forEach(x=>{
      const itemId = `feed-${stableHash(x.url)}`;
      const officialSource = /^(official|weibo|bilibili)/.test(x.channel || '');
      const media = x.image_url ? `<div class="news-thumb"><img src="${esc(x.image_url)}" alt="${esc(x.image_alt || x.title)}" loading="lazy"></div>` : '';
      body += `<article class="news${x.image_url ? ' news-with-media' : ''}" id="${itemId}">${media}<div class="news-copy">` +
        `<span class="ch ${esc(x.channel)}">${esc(CH_NAME[x.channel]||x.channel)}</span>` +
        statusBadge(officialSource?'official':'public',officialSource?'官方来源':'公开来源')+
        (x.signal==='rumor' ? `<span class="tag v-low">瓜</span>` : ``) +
        (x.time ? `<span class="tag act">${esc(x.time)}</span>` : ``) +
        `<div class="h"><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a></div>` +
        (x.summary && x.summary !== x.title ? `<div class="d">${esc(x.summary)}</div>` : ``) +
        `<div class="d">${x.source ? esc(x.source)+' · ' : ''}<a class="u" href="${esc(x.url)}" target="_blank" rel="noopener">原文 ↗</a> · <button class="jump-link" data-share-id="${itemId}" data-share-page="feed.html" data-share-title="${esc(x.title)}">分享切片</button></div></div></article>`;
    });
  });
  if(!list.length) body = `<div class="empty">窗口内暂无动态</div>`;
  body += `<div class="pager">` +
    `<button class="pager-btn" data-pg="prev"${feedPage<=1?' disabled':''}>‹ 上一页</button>` +
    `<span class="pager-info">${feedPage} / ${totalPages} 页 · ${list.length} 条</span>` +
    `<button class="pager-btn primary" data-pg="next"${feedPage>=totalPages?' disabled':''}>下一页 ›</button>` +
    `</div>`;
  el.innerHTML = h + body;

      feedPage = 1;
      renderFeed();

      feedPage += b.dataset.pg==='prev' ? -1 : 1;
      renderFeed();
      el.scrollIntoView({ behavior:'smooth', block:'start' });
    });
  });
  bindShare(el);
}

const REPORT_ORDER = ['official','media','weibo','bilibili','bilibili-bej','bilibili-gnz','bilibili-cgt','weibo-super','weibo-hot','tieba-hg','tieba','douban'];
const REPORT_ACTION_RANK = { '公布':1, '夺冠':2, '落幕':3, '开启':4, '官宣':4, '首演':5, '公告':6, '入围':7, '资讯':9 };
const reportToday = () => {
  const arc = DATA.brief?.archive || [];
  return (arc[0] && arc[0].brief_date) || DATA.brief?.brief_date || DATA.as_of;

const reportViewpoints = latest => {
  // 今日看点：正式来源优先，同来源取时间最新，最多 5 条；贴吧/豆瓣纯讨论不上看点
  const formal = (latest || []).filter(x => !/tieba|douban/.test(x.channel || ''));
  const seen = new Set();
  const out = [];
  formal.sort((a, b) => {
    const ra = REPORT_ACTION_RANK[a.action] || 9, rb = REPORT_ACTION_RANK[b.action] || 9;
    if(ra !== rb) return ra - rb;
    return REPORT_ORDER.indexOf(a.channel) - REPORT_ORDER.indexOf(b.channel);
  });
  for(const x of formal){
    if(out.length >= 5) break;
    if(seen.has(x.channel)) continue;
    seen.add(x.channel);
    out.push(x);
  }
  if(out.length < 3) out.push(...formal.filter(x => !out.includes(x)).slice(0, 3 - out.length));
  return out.slice(0, 8);
};
const reportTimeline = latest => {
  // 时间线：按日期分组（日期记录），组内按时辰倒序
  const groups = [];

    const d = (x.published_at || '').slice(0, 10) || '未知日期';
    (byDay[d] = byDay[d] || []).push(x);
  });
  Object.keys(byDay).sort().reverse().forEach(d => {
    const items = byDay[d].sort((a, b) => ((b.published_at_tz || '') < (a.published_at_tz || '') ? -1 : 1));
    groups.push({ date: d, items });
  });
  return groups;
};

    `<div class="rp-data"><b>${n24}</b><span>24 小时新讯</span></div>`+
    `<div class="rp-data"><b>${nwin}</b><span>近 ${esc(String(b.window_days || 7))} 天窗口</span></div>`+
    `<div class="rp-data"><b>${(b.source_tags || []).length}</b><span>来源覆盖</span></div>`+
    `<div class="rp-data"><b>${(b.hot_topics || []).length}</b><span>热点主题</span></div>`+
    `<div class="rp-data"><b>${(b.event_updates || []).length}</b><span>追踪事件</span></div>`+
    `</div>`;
  if(arc.length > 1){
    h += `<nav class="rp-dates"><span class="rp-dates-label">往期</span>${arc.slice(0, 30).map(p => pickBtn(p.brief_date)).join('')}</nav>`;
  }
  if(lead){
    const cover = briefCover(lead);
    h += `<div class="rp-lead"><div class="rp-lead-txt">`+
      `<p class="rp-kicker">今日头条 · ${esc(lead.tag || lead.channel || '')} · ${esc(tz(lead.published_at_tz))}</p>`+
      `<h3 class="rp-headline"><a href="${esc(lead.url)}" target="_blank" rel="noopener" title="${esc(lead.title)}">${esc(compactTitle(lead.title, 72))}</a></h3>`+
      `<p class="rp-summary">${esc(lead.summary || lead.title)}</p>`+
      `<div class="rp-meta">${esc(lead.source || '')} · <a href="${esc(lead.url)}" target="_blank" rel="noopener">原文 ↗</a></div>`+
      `</div>`;
    if(cover && cover.photo){
      h += `<figure class="rp-figure"><img src="${esc(cover.photo)}" alt="${esc(cover.name)}" loading="lazy"><figcaption>${esc(coverCaption(cover))}</figcaption></figure>`;
    }
    h += `</div>`;
  }
  h += `<div class="rp-body"><div class="rp-main">`;
  if(viewpoints.length){
    h += `<section class="rp-view"><div class="rp-sec">今日看点<em>HIGHLIGHTS</em></div><ol class="rp-view-list">`;
    viewpoints.forEach((x, i) => {
      h += `<li class="rp-view-item"><span class="rp-view-num">${i + 1}</span>`+
        `<span class="rp-view-main"><span class="ch ${esc(x.channel)}">${esc(CH_NAME[x.channel] || x.channel)}</span>`+
        `<a class="rp-view-t" href="${esc(x.url)}" target="_blank" rel="noopener" title="${esc(x.title)}">${esc(compactTitle(x.title))}</a>`+
        `<span class="rp-view-m">${esc(x.summary || '')}</span></span></li>`;
    });
    h += `</ol></section>`;
  }
  h += `<section class="rp-tl"><div class="rp-sec">今日时间线<em>TIMELINE</em></div>`;
  let tlTotal = 0;
  if(!timeline.length){
    h += `<div class="empty">本窗口暂无新讯</div>`;
  }else{
    /* 先按基准条数渲染，多渲染出一批「隐藏余量」（.rp-extra）。
       左右栏该多少条取决于当天数据：热点有时 10 条、成员动态有时为 0，
       固定条数必然一栏空一截。余量留给渲染后的实测补齐/回收。 */
    const timelineBase = 14;
    const timelineMax = 30;
    tlTotal = timeline.reduce((sum, group) => sum + group.items.length, 0);
    let rendered = 0;
    timeline.forEach(g => {
      const room = Math.max(0, timelineMax - rendered);
      if(!room) return;
      const visibleItems = g.items.slice(0, room);
      if(!visibleItems.length) return;
      h += `<div class="rp-day"><div class="rp-day-head"><span class="rp-day-date">${esc(g.date)}</span><span class="rp-day-n">${g.items.length} 条</span></div>`;
      visibleItems.forEach(x => {
        const extra = rendered >= timelineBase ? ' rp-extra' : '';
        rendered += 1;
        h += `<div class="rp-item${extra}"><span class="rp-time">${esc(tz(x.published_at_tz) || '—')}</span>`+
          `<span class="ch ${esc(x.channel)}">${esc(CH_NAME[x.channel] || x.channel)}</span>`+
          `<span class="rp-t"><a href="${esc(x.url)}" target="_blank" rel="noopener" title="${esc(x.title)}">${esc(compactTitle(x.title, 44))}</a></span>`+
          `<span class="rp-m">${esc(x.summary || '')}</span></div>`;
      });
      h += `</div>`;
    });
    h += `<p class="rp-foot" data-tl-foot>已展示 ${Math.min(tlTotal, timelineBase)} 条正式来源动态；其余 ${Math.max(0, tlTotal - timelineBase)} 条可在「现场」频道继续阅读。</p>`;
  }
  h += `</section></div><div class="rp-aside">`;
  if((b.hot_topics || []).length){
    h += `<section><div class="rp-sec">热点榜<em>STANDINGS</em></div>`;
    (b.hot_topics || []).slice(0, 10).forEach(t => {
      h += `<div class="rp-board-row"><span class="rp-board-rank">${t.rank}</span>`+
        `<span class="rp-board-main"><span class="rp-board-t">${jump(compactTitle(t.title, 46), 'hot', hotAnchor(t))}</span>`+
        `<span class="rp-board-w">${esc(t.why_hot)}</span></span></div>`;
    });
    h += `</section>`;
  }
  if((b.event_updates || []).length){
    h += `<section><div class="rp-sec">事件进展<em>TRACKER</em></div>`;
    (b.event_updates || []).slice(0, 8).forEach(e => {
      h += `<div class="rp-move"><span class="rp-move-k">${e.item_count} 条</span>`+
        `<span class="rp-move-t">${jump(e.event, 'stories', storyAnchor(e))}`+
        `<span class="rp-move-d">${esc(e.latest)}</span></span></div>`;
    });
    h += `</section>`;
  }
  if((b.member_moves || []).length){
    h += `<section><div class="rp-sec">人事动态<em>MOVES</em></div>`;
    (b.member_moves || []).forEach(m => {
      h += `<div class="rp-move"><span class="rp-move-k">${esc(m.type || '动态')}</span>`+
        `<span class="rp-move-t"><b>${esc(m.member)}</b>`+
        `<span class="rp-move-d">${esc(m.latest_at || '')}${m.item_count ? ' · ' + m.item_count + ' 条来源' : ''}</span></span></div>`;
    });
    h += `</section>`;
  }
  /* 右栏常常偏矮（热点可能只有 5 条、成员动态可能为 0），补一块「最新切片」：
     既填高度，又把日报引向可分享的稳定锚点，而不是让分隔竖线半途而废。 */
  const asideSlices = (ARCHIVE.slices || []).slice(0, 6);
  if(asideSlices.length){
    h += `<section><div class="rp-sec">最新切片<em>ARCHIVE</em></div>`;
    asideSlices.forEach(s => {
      h += `<div class="rp-move"><span class="rp-move-k">${esc(s.date || '—')}</span>`+
        `<span class="rp-move-t"><a href="${slicePage(s.id)}">${esc(compactTitle(s.title, 40))}</a>`+
        `<span class="rp-move-d">${esc((s.members || []).slice(0, 2).join('、') || '未标注成员')}</span></span></div>`;
    });
    h += `</section>`;
  }
  h += `</div></div>`;
  h += `<div class="brief-cta"><button class="jump-link cta-btn" data-section="feed">查看全部动态 →</button><button class="jump-link cta-btn" data-section="hot">完整热点榜 →</button></div>`;
  h += `<p class="rp-foot">48日报 · 每日 09:00 由「采集 → 策展 → 热点 → 事件 → 简报」流水线生成一期，非实时刷新；可用上方日期切换往期正文。${esc(b.honest_line || '') ? ' · ' + esc(b.honest_line) : ''}</p>`;
  h += `</div>`;
  el.innerHTML = h;
  /* 左右栏同高靠实测，不靠猜条数：当天热点可能 10 条也可能 5 条、成员动态可能为 0，
     固定条数必然让一栏空一截。渲染后测两栏高度差：右栏高就放出时间线余量，
     左栏高就回收（保底 8 条），最后同步「已展示 N 条」的说明，避免说明与实际不符。 */
  (() => {
    const main = el.querySelector('.rp-main');
    const aside = el.querySelector('.rp-aside');
    if(!main || !aside) return;
    const visible = () => Array.from(el.querySelectorAll('.rp-item:not(.rp-extra)'));
    const gap = () => {
      const a = aside.getBoundingClientRect().height, b = main.getBoundingClientRect().height;
      return (typeof a === 'number' && typeof b === 'number' && isFinite(a) && isFinite(b)) ? (a - b) : 0;
    };
    let guard = 0;
    while(gap() > 140 && guard++ < 14){
      const next = el.querySelector('.rp-item.rp-extra');
      if(!next) break;
      next.classList.remove('rp-extra');
    }
    guard = 0;
    while(gap() < -140 && visible().length > 8 && guard++ < 14){
      const list = visible();
      list[list.length - 1].classList.add('rp-extra');
    }
    el.querySelectorAll('.rp-day').forEach(d => {
      if(!d.querySelector('.rp-item:not(.rp-extra)')) d.classList.add('rp-extra');
    });
    const foot = el.querySelector('[data-tl-foot]');
    if(foot){
      const shown = visible().length;
      foot.textContent = shown >= tlTotal
        ? `时间线已展示全部 ${shown} 条正式来源动态。`
        : `已展示 ${shown} 条正式来源动态；其余 ${tlTotal - shown} 条可在「现场」频道继续阅读。`;
    }
  })();
  bindJumps(el);
  bindShare(el);
  el.querySelectorAll('.rp-chip').forEach(c => c.addEventListener('click', () => {
    const d = c.dataset.rp;
    renderBrief(d === reportToday() ? '' : d);
  }));
}

/* ---- 热点 ---- */
let hotTier = 'all';
function renderHot(){
  const el = document.getElementById('hot');
  const all = DATA.hot_topics || [];
  const topics = all.filter(t => hotTier === 'all' || t.tier === hotTier);
  const tierLabel = t => t==='P0' ? '重点' : (t==='P1' ? '关注' : '常规');
  const CH = {official:'官网', weibo:'微博', bilibili:'B站', media:'媒体', 'bilibili-bej':'BEJ', 'bilibili-gnz':'GNZ', 'bilibili-cgt':'CGT', 'weibo-hot':'热搜', 'weibo-super':'超话', 'tieba-hg':'生个女孩吧', tieba:'贴吧', douban:'豆瓣', zhihu:'知乎'};
  const bodyFold = list => list && list.length
    ? `<details class="editorial-fold"><summary>收录正文 ${list.length} 篇</summary>` + list.map(b =>
      `<div class="news"><div class="h">${esc(b.title)}</div><div class="d">${esc(b.summary || '')}</div>`+
      `<details class="editorial-fold"><summary>阅读正文</summary><div class="body-txt">${esc(b.body)}</div></details></div>`).join('') + `</details>`
    : '';
  const trendHtml = t => {
    const d = t.trend_delta || 0;
    if (t.trend === 'new') return `<span class="trend t-new">● 新</span>`;
    if (t.trend === 'up') return `<span class="trend t-up">↗ ${d > 0 ? '+' + d : d}</span>`;
    if (t.trend === 'down') return `<span class="trend t-down">↘ ${d < 0 ? d : '-' + d}</span>`;
    return `<span class="trend t-flat">→ 平</span>`;
  };
  const indexHtml = t => {
    const n = Math.max(0, Math.min(100, t.hot_index || 0));
    return `<span class="hot-index"><span class="hi-num">${n}</span><span class="hi-track"><i style="width:${n}%"></i></span></span>`;
  };
  const srcHtml = t => {
    const names = (t.channels || []).map(c => CH[c] || c);
    const parts = [`${t.channel_count} 源`, `${t.item_count} 条`];
    if (t.has_top) parts.push('官方置顶');
    return `<span class="hi-src">${parts.join(' · ')}${names.length ? ' · ' + names.slice(0,4).join('/') + (names.length>4?'…':'') : ''}</span>`;
  };
  const leadOf = t => `<article class="hot-lead" id="${esc(t.anchor_id)}">`+
    `<div class="hot-head"><span class="rank r${t.rank}">${t.rank}</span><div class="hot-main">`+
    `<div class="ttl" title="${esc(t.title)}">${esc(compactTitle(t.title, 66))}</div><div class="why">${esc(t.why_hot)}</div>`+
    `<div class="hot-metrics"><span class="tag ${tierTag(t.tier)}">${tierLabel(t.tier)}</span>${indexHtml(t)}${trendHtml(t)}${srcHtml(t)}<span class="hi-time">${esc(t.latest_at)}</span></div>`+
    `</div></div>${bodyFold(t.bodies)}</article>`;
  const rowOf = t => `<article class="hot-row" id="${esc(t.anchor_id)}"><span class="rank r${t.rank}">${t.rank}</span>`+
    `<div class="hot-main"><div class="ttl" title="${esc(t.title)}">${esc(compactTitle(t.title, 58))}</div>`+
    `<div class="hot-metrics">${indexHtml(t)}${trendHtml(t)}${srcHtml(t)}<span class="hi-time">${esc(t.latest_at)}</span></div>`+
    `${bodyFold(t.bodies)}</div></article>`;
  let h = `<h2>热点榜</h2><p class="hint">热点指数 0–100（公开公式：时效 + 聚合 + 来源覆盖 + 官方置顶）· ↗↘ 趋势 = 近 24h 新增信号对比前 24h · 公式详见文档。</p>`;
  h += `<div class="cats">${['all','P0','P1','P2'].map(t => `<button class="cat-chip${hotTier===t?' on':''}" data-tier="${t}">${t==='all'?'全部':tierLabel(t)} ${t==='all'?all.length:all.filter(x=>x.tier===t).length}</button>`).join('')}</div>`;
  if(topics[0]) h += leadOf(topics[0]);
  if(topics.slice(1).length) h += `<div class="hot-list">${topics.slice(1).map(rowOf).join('')}</div>`;
  if(!topics.length) h += `<div class="empty">该分级暂无热点</div>`;
  el.innerHTML = h;
  el.querySelectorAll('[data-tier]').forEach(b => b.addEventListener('click', () => { hotTier = b.dataset.tier; renderHot(); }));
}

/* ---- 事件 ---- */
function renderStories(){
  const el = document.getElementById('stories');
  const nodeOf = m => `<div class="node"><span class="dt">${esc(m.date)}</span><span class="ms">${esc(m.milestone || '')}</span><div>${esc(m.title)}</div>`+
    (m.body ? `<details class="editorial-fold"><summary>阅读正文</summary><div class="body-txt">${esc(m.body)}</div></details>` : '') + `</div>`;
  let h = `<h2>事件时间线</h2><p class="hint">先看最新进展；历史节点按需展开。</p>`;
  (DATA.stories||[]).forEach(e=>{
    const latest = (e.milestones || []).find(m => m.date===e.latest.date && m.title===e.latest.title) || e.latest;
    const rest = (e.milestones || []).filter(m => !(m.date===latest.date && m.title===latest.title));
    h += `<article class="story" id="${esc(e.anchor_id)}"><div class="story-head"><span class="ttl">${esc(e.title)}</span>`+
      `<span class="tag act">${e.item_count} 条</span><span class="meta">${esc(e.earliest_at)} - ${esc(e.latest_at)} · ${(e.groups||[]).map(g=>g.toUpperCase()).join(' / ')}</span></div>`+
      `<div class="story-latest"><span class="dt">最新 · ${esc(latest.date)}</span>${esc(latest.title)}`+
      (latest.body ? `<details class="editorial-fold"><summary>阅读正文</summary><div class="body-txt">${esc(latest.body)}</div></details>` : '') + `</div>`+
      (rest.length ? `<details class="editorial-fold"><summary>查看 ${rest.length} 个历史节点</summary><div class="tl editorial">${rest.map(nodeOf).join('')}</div></details>` : '') +
      `<div class="meta">最新原文：<a href="${esc(e.latest.url)}" target="_blank" rel="noopener">打开 ↗</a></div></article>`;
  });
  if(!(DATA.stories||[]).length) h += `<div class="empty">暂无事件</div>`;
  el.innerHTML = h;
}

/* ---- 精选 ---- */
function renderCurated(){
  const el = document.getElementById('curated');
  const all = DATA.curated||[];
  const CATS = [['all','全部'],['3','资讯'],['1','公演公告'],['2','握手答谢'],['4','活动'],['5','辟谣'],['other','多团归并']];
  let curCat = 'all';
  const catOf = c => (c.catid==null ? 'other' : String(c.catid));
  const countOf = cat => cat==='all' ? all.length : all.filter(c=>catOf(c)===cat).length;
  const renderList = (list) => {
    const by = {};
    list.forEach(c=>{ (by[c.published_at] ||= []).push(c); });
    let out = '';
    Object.keys(by).sort().reverse().forEach(day=>{
      out += `<div class="day">${esc(day)}（${by[day].length} 条）</div>`;
      by[day].forEach(c=>{
        out += `<div class="news"><span class="tag ${tierTag(c.tier)}">${c.tier}</span><span class="tag grp">${esc(c.group)}</span>`+
               `<div class="h">${esc(c.title)}</div>`+
               `<div class="d">${esc(c.reason)}</div>`+
               `<div class="d"><a class="u" href="${esc(c.url)}" target="_blank" rel="noopener">原文 ↗</a></div></div>`;
      });
    });
    return out;
  };
  const renderBody = () => {
    const fp0 = all.filter(c=>c.tier==='P0' && (curCat==='all' || catOf(c)===curCat));
    const fp1 = all.filter(c=>c.tier!=='P0' && (curCat==='all' || catOf(c)===curCat));
    let out = '';
    if(fp0.length) out += `<div class="sec-ttl">🔴 P0 重点精选（${fp0.length} 条）</div>` + renderList(fp0);
    if(fp1.length) out += `<details class="fold"><summary>P1 常规精选（${fp1.length} 条，点击展开）</summary>` + renderList(fp1) + `</details>`;
    if(!fp0.length && !fp1.length) out += `<div class="empty">该分类下暂无精选</div>`;
    return out;
  };
  let h = `<h2>历史档案</h2><p class="hint">官网历史条目（2016–2019）· 排除政务公告/行政文、归并多团镜像后按 P0/P1 分级 · 默认折叠，展开后可分类浏览。</p>`;
  h += `<details class="fold"><summary>展开官网历史档案（${all.length} 条）</summary>`;
  h += `<div class="cats">` + CATS.map(([v,name])=>`<button class="cat-chip${v===curCat?' on':''}" data-cat="${v}">${name} ${countOf(v)}</button>`).join('') + `</div>`;
  h += `<div id="curated-body">` + renderBody() + `</div>`;
  h += `</details>`;
  el.innerHTML = h;
  el.querySelectorAll('.cat-chip').forEach(b=>{
    b.addEventListener('click', ()=>{
      curCat = b.dataset.cat;
      el.querySelectorAll('.cat-chip').forEach(x=>x.classList.toggle('on', x.dataset.cat===curCat));
      el.querySelector('#curated-body').innerHTML = renderBody();
    });
  });
}

/* ---- 厕所瓜 ---- */
function renderGua(){
  const el = document.getElementById('gua');
  const g = DATA.guapool || {guas:[]};
  const topicOf = x => {
    const id = `gua-${stableHash(`${x.member}|${x.latest_at}`)}`;
    let out = `<article class="card" id="${id}">${x.confirmed ? statusBadge('official','已由官方记录证实') : statusBadge('rumor',x.verdict || '仅传闻')}`+
         `<h3 class="ttl">${esc(x.member)}</h3><div class="meta">讨论记录 ${x.item_count} 条 · 来源 ${(x.channels||[]).join(' / ')} · 最新 ${esc(x.latest_at)} · 机器可信度 ${x.credibility}/100（仅辅助，不等于事实）</div>`;
    (x.confirmed_by||[]).forEach(c=>{
      out += `<div class="news"><div class="h">✔ 官方证实（${esc(c.event)}）：${esc(compactTitle(c.title))}</div>`+
           `<div class="d">${esc(c.published_at)} · <a class="u" href="${esc(c.url)}" target="_blank" rel="noopener">原文 ↗</a></div></div>`;
    });
    const items = x.items || [];
    items.slice(0, 3).forEach(it=>{
      out += `<div class="news"><div class="h">${esc(compactTitle(it.title))}</div>`+
           `<div class="d">${esc(it.published_at)} · <a class="u" href="${esc(it.url)}" target="_blank" rel="noopener">原文 ↗</a></div></div>`;
    });
    if(items.length > 3) out += `<details class="editorial-fold"><summary>展开余下 ${items.length - 3} 条讨论</summary>${items.slice(3).map(it => `<div class="news"><div class="h">${esc(compactTitle(it.title))}</div><div class="d">${esc(it.published_at)} · <a class="u" href="${esc(it.url)}" target="_blank" rel="noopener">原文 ↗</a></div></div>`).join('')}</details>`;
    out += `<div class="dossier-actions"><button class="archive-btn" data-share-id="${id}" data-share-page="gua.html" data-share-title="${esc(x.member)} · ${esc(x.verdict || '传闻')}" data-share-text="48HOT 舆论场：请连同真伪标识与来源一起阅读">连同真伪标识分享</button><a class="archive-btn" href="contribute.html?type=correction&slice=${id}">提交证据或纠错</a></div>`;
    return out + `</article>`;
  };
  const topics = g.guas || [];
  let h = `<div class="discovery-intro"><div><h2>传闻与舆论场</h2><p>${esc(g.disclaimer||'')} 这里允许瓜和争议存在，但每个话题必须先告诉读者：已证实、待核，还是仅传闻。未经证实的讨论不进入日报、热点和事件结论。</p></div><aside class="discovery-rule"><strong>阅读顺序</strong>先看真伪标识，再看来源和时间，最后才看观点。分享时会保留当前话题锚点。</aside></div>`;
  h += topics.slice(0, 3).map(topicOf).join('');
  if(topics.length > 3) h += `<details class="fold"><summary>展开其余 ${topics.length - 3} 个未证实话题</summary>${topics.slice(3).map(topicOf).join('')}</details>`;
  if(!(g.guas||[]).length) h += `<div class="empty">当前窗口暂无厕所瓜（可能真没有，也可能瓜帖已沉，见 docs/guapool.md）</div>`;
  const F = DATA.feed || {};
  const folk = (F.days7 || []).filter(x => /tieba|douban/.test(x.channel || ''));
  if(folk.length){
    h += `<div class="sec-ttl">民间讨论 · 近 7 天贴吧/豆瓣（${folk.length} 条）</div>`;
    folk.slice(0, 8).forEach(x=>{
      h += `<div class="news"><span class="ch ${esc(x.channel)}">${esc(CH_NAME[x.channel]||x.channel)}</span>`+
           `<div class="h"><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a></div>`+
           (x.summary && x.summary !== x.title ? `<div class="d">${esc(x.summary)}</div>` : '')+
           `<div class="d">${esc(x.date || '')} · <a class="u" href="${esc(x.url)}" target="_blank" rel="noopener">原文 ↗</a></div></div>`;
    });
  }
  el.innerHTML = h;
  bindShare(el);
}

/* ---- 成员事件 ---- */
function renderMemberEvents(){
  const el = document.getElementById('members');
  const roster = DATA.roster || [];
  const events = (DATA.member_events || []).filter(e => e.member && e.member !== '未指明');
  const byMember = {};
  events.forEach(e => { (byMember[e.member] ||= []).push(e); });

  const active = roster.filter(m => m.status === 'active');
  const honor  = roster.filter(m => m.status === 'honor');
  const retired = roster.filter(m => m.status === 'retired');
  const rosterNames = new Set(roster.map(m => m.name));
  const extraRetired = Object.keys(byMember).filter(n => !rosterNames.has(n));
  const statusLabel = s => s === 'active' ? '在团' : s === 'honor' ? '荣誉毕业' : '退团/离团';

  const portrait = m => m.avatar
    ? `<span class="member-portrait"><img src="${esc(m.avatar)}" alt="${esc(m.name)}" loading="lazy" onerror="this.onerror=null;this.parentElement.textContent='${esc(m.name.slice(-1))}';"></span>`
    : `<span class="member-portrait" aria-label="${esc(m.name)}">${esc(m.name.slice(-1))}</span>`;

  const eventOf = e => {
    const latest = e.latest || (e.timeline || [])[e.timeline.length - 1] || {};
    const history = (e.timeline || []).filter(t => !(t.date===latest.date && t.title===latest.title));
    return `<article class="member-event"><div class="story-head"><span class="ttl">${esc(e.event_type)}</span><span class="tag act">${e.item_count} 条</span>`+
      `<span class="meta">${esc(e.earliest_at)} - ${esc(e.latest_at)}</span></div><a class="latest-line" href="${esc(latest.url)}" target="_blank" rel="noopener">${esc(latest.title)} ↗</a>`+
      (history.length ? `<details class="editorial-fold"><summary>查看 ${history.length} 条相关动态</summary><div class="tl editorial">${history.map(t => `<div class="node"><span class="dt">${esc(t.date)}</span><span class="tag grp">${esc(t.channel)}</span><div><a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.title)}</a></div></div>`).join('')}</div></details>` : '') + `</article>`;
  };

  const radarChart = m => {
    const r = m && m.rating;
    if(!r) return '';
    const axes = [['performance','业务'],['popularity','人气'],['engagement','营业'],['charm','魅力']];
    const n = 4, cx = 90, cy = 88, R = 58;
    const pt = (i, v) => {
      const ang = -Math.PI/2 + i*2*Math.PI/n;
      const rr = R * (v/100);
      return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)];
    };
    let grid = '', spokes = '';
    for(let i=0;i<n;i++){
      const p = pt(i, 100);
      spokes += `<line x1="${cx}" y1="${cy}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
    }
    for(let lv=1; lv<=3; lv++){
      const g = axes.map((_, i) => { const p = pt(i, lv*100/3); return `${p[0].toFixed(1)},${p[1].toFixed(1)}`; }).join(' ');
      grid += `<polygon points="${g}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
    }
    const dataPts = axes.map(([k], i) => { const v = r.axes[k]; const p = pt(i, v==null?0:v); return `${p[0].toFixed(1)},${p[1].toFixed(1)}`; }).join(' ');
    const labels = axes.map(([k,label], i) => {
      const ang = -Math.PI/2 + i*2*Math.PI/n;
      const lx = cx + (R+18)*Math.cos(ang), ly = cy + (R+18)*Math.sin(ang);
      const v = r.axes[k];
      return `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" class="radar-label">${label} ${v==null?'—':v}</text>`;
    }).join('');
    return `<svg class="radar" viewBox="0 0 180 180" role="img" aria-label="能力雷达图">${grid}${spokes}<polygon points="${dataPts}" fill="var(--accent)" fill-opacity="0.22" stroke="var(--accent)" stroke-width="2"/>${labels}</svg>`;
  };

  const ratingCard = m => {
    const r = m && m.rating;
    if(!r) return '';
    const isActive = r.mode === 'current';
    const rows = [['performance','业务'],['popularity','人气'],['engagement','营业'],['charm','魅力']].map(([k,label]) => {
      const v = r.axes[k];
      let fill = v == null ? 0 : v;
      let val = v == null ? '—' : String(v);
      if(isActive && v == null) val = '待评分';
      return `<div class="rax"><span class="rname">${label}</span><div class="rbar"><span class="rfill" style="width:${fill}%"></span></div><span class="rval">${val}</span></div>`;
    }).join('');
    let head;
    if(isActive){
      const tierCls = r.tier ? ' t' + r.tier : '';
      const totalTxt = r.total == null ? `待评分 · 已有 ${r.axes_scored}/4 轴数据` : `综合 ${r.total} 分`;
      head = `<span class="tier${tierCls}">${r.total == null ? '—' : esc(r.tier)}</span><span class="rtxt">${esc(totalTxt)}</span>`;
    }else{
      head = `<span class="status-chip">${esc(r.status_label || '已离团')}</span><span class="rtxt">不参与现行评级 · 仅评生涯业务/魅力</span>`;
    }
    const note = isActive
      ? '业务/魅力/营业为编辑初评（待社区投票校正）。'
      : '已离团成员：人气/营业不再评，业务/魅力仅作生涯参考。';
    return `<div class="rating-card"><p class="module-kicker">能力评级 · ${isActive ? '当前状态' : '生涯参考'}</p>`+
      `<div class="rating-total">${head}</div>`+
      `<div class="rating-body"><div class="radar-wrap">${radarChart(m)}</div><div class="raxes">${rows}</div></div>`+
      (r.risk ? `<p class="risk-hint">⚠ ${esc(r.risk)}</p>` : '')+
      `<p class="hint">${esc(note)}</p></div>`;
  };

  const VOTE_KEY = '48hot-votes-v1';
  const LV = {1:'弱',2:'偏弱',3:'中规',4:'强',5:'顶尖'};
  const loadVotes = () => { try { return JSON.parse(localStorage.getItem(VOTE_KEY) || '{}'); } catch(e){ return {}; } };
  const saveVotes = v => { try { localStorage.setItem(VOTE_KEY, JSON.stringify(v)); } catch(e){} };
  const voteCount = v => Object.keys(v).filter(n => v[n] && Object.keys(v[n]).length).length;
  const votePanel = m => {
    if(!m) return '';
    const dims = DATA.vote_dims || [];
    const isActive = m.rating && m.rating.mode === 'current';
    const allowed = isActive ? ['performance','charm','engagement'] : ['performance','charm'];
    const byAxis = {};
    dims.filter(d => allowed.includes(d.axis)).forEach(d => { (byAxis[d.axis] ||= []).push(d); });
    const axisOrder = ['performance','charm','engagement'];
    const mine = loadVotes()[m.name] || {};
    const mkBtns = d => {
      let b = '';
      for(let l=1;l<=5;l++){
        b += `<button data-vname="${esc(m.name)}" data-vkey="${esc(d.key)}" data-vlvl="${l}" class="${mine[d.key]===l ? 'on':''}" title="${LV[l]}">${l}</button>`;
      }
      return `<div class="vote-row"><span class="vname">${esc(d.name)}</span><div class="vbtns">${b}</div></div>`;
    };
    const rows = axisOrder.filter(a => byAxis[a]).map(a =>
      `<div class="vote-axis"><p class="vote-axis-name">${esc(byAxis[a][0].axis_name)}</p>${byAxis[a].map(mkBtns).join('')}</div>`
    ).join('');
    const totalDims = dims.filter(d => allowed.includes(d.axis)).length;
    return `<div class="vote-card"><p class="module-kicker">社区投票 · 主观维度</p>`+
      `<p class="hint">打分：1 弱 · 3 中规 · 5 顶尖${isActive ? '' : '（已离团不评营业）'}。投票保存在本机，导出后交给编辑合并进评级。</p>`+
      rows+
      `<div class="vote-actions"><button class="primary" data-vact="export">导出我的投票</button><button data-vact="copy">复制投票</button><button data-vact="clear" data-vmember="${esc(m.name)}">清空 TA</button></div>`+
      `<p class="vote-count">已为 ${voteCount(loadVotes())} 位成员投票 · ${esc(m.name)} 已投 ${Object.keys(mine).length}/${totalDims} 项</p></div>`;
  };

  const keyOf = m => (m && m.sid) ? ('s' + m.sid) : ('~' + (m ? m.name : ''));
  const evidencePanel = m => {
    const evidence = (m && m.discovery_evidence) || [];
    if(!evidence.length) return `<div class="member-evidence"><p class="module-kicker">作品与成长证据</p><p class="hint">当前公开来源中还没有匹配到足够的舞台、Focus、MC 或成长记录。你可以提交可回溯证据帮助补档。</p><a class="archive-btn" href="contribute.html">为 TA 补充证据</a></div>`;
    return `<div class="member-evidence"><p class="module-kicker">作品与成长证据 · ${evidence.length} 条</p><p class="hint">以下是公开来源切片，不等同于能力排名。每条均可追溯、分享和纠错。</p><div class="slice-ledger">${evidence.map(item => `<article class="slice-entry" id="member-${esc(m.sid)}-${esc(item.id)}"><div class="slice-stamp">${statusBadge(item.verification,item.verification_label)}<strong>${esc(item.content_type_label)}</strong><time>${esc(item.date)}</time></div><div><h3><a href="${slicePage(item.id)}">${esc(item.title)}</a></h3>${item.summary?`<p>${esc(compactTitle(item.summary,140))}</p>`:''}</div><div class="slice-actions"><button class="archive-btn primary" data-share-id="${esc(item.id)}" data-share-page="members.html" data-share-title="${esc(m.name)} · ${esc(item.title)}">分享切片</button><a class="archive-btn" href="contribute.html?type=correction&slice=${esc(item.id)}">纠错</a></div></article>`).join('')}</div></div>`;
  };
  const subjectivePanel = m => m ? `<details class="editorial-fold"><summary>社区观点与能力初评（主观，不影响事实档案）</summary>${ratingCard(m)}${votePanel(m)}</details>` : '';
  const watchPanel = m => {
    if(!m) return '';
    const guide = m.watch_guide || [];
    return `<div class="member-evidence"><h3>认识${esc(m.name)}，从这里开始</h3><p class="hint">按已有官方视频整理观看顺序；以下是观看建议，尚未作唱跳能力评级。</p>${guide.length ? guide.map((item,i)=>`<article class="member-event"><p class="dossier-type">${i===0?'先看这一支':'接着看'} · ${esc(item.watch_kind)}</p><h3><a href="${esc(item.url)}" target="_blank" rel="noopener">${esc(item.title)} ↗</a></h3><p>${esc(item.watch_reason)}</p><p class="meta">官方视频来源 · ${esc(item.date)} · ${esc(item.members.join('、'))}${item.members.length>1?'（多人内容）':''}</p></article>`).join('') : '<p>还没有匹配到官方视频入口，欢迎补充舞台、直拍或 MC 的原始链接与时间段。</p>'}<a class="archive-btn" href="contribute.html?member=${encodeURIComponent(m.name)}">补充入坑片段或精彩时刻</a></div>`;
  };
  const renderDetail = key => {
    const m = key.startsWith('~') ? undefined : roster.find(x => ('s' + x.sid) === key);
    const name = m ? m.name : key.slice(1);
    const list = byMember[name] || [];
    let profile;
    if(m){
      const expItems = (m.experience || '').split('；').filter(Boolean);
      profile = `<div class="member-detail-head">${portrait(m)}<div><h3 class="member-detail-title">${esc(m.name)}</h3>`+
        `<p class="hint">${esc(statusLabel(m.status))} · ${esc(m.group)} ${esc(m.team)} · ${esc(m.generation || '')}</p>`+
        (m.concurrent && m.concurrent.length ? `<p class="hint">兼任：${esc(m.concurrent.join('、'))}</p>` : '')+
        (m.nickname ? `<p class="hint">昵称：${esc(m.nickname)}</p>` : '') + `</div></div>`+
        `<p class="module-kicker">客观事实卡 · 官网公开数据</p>`+
        `<dl class="member-facts">`+
        (m.ranking ? `<div><dt>本届名次</dt><dd>#${esc(m.ranking)}</dd></div>` : (m.best_rank ? `<div><dt>历史巅峰</dt><dd>#${esc(m.best_rank)}</dd></div>` : ''))+
        (m.departure_date ? `<div><dt>离团</dt><dd>${esc(m.departure_date)}</dd></div>` : '')+
        (m.birth_day ? `<div><dt>生日</dt><dd>${esc(m.birth_day)}</dd></div>` : '')+
        (m.star_sign_12 ? `<div><dt>星座</dt><dd>${esc(m.star_sign_12)}</dd></div>` : '')+
        (m.blood_type ? `<div><dt>血型</dt><dd>${esc(m.blood_type)}</dd></div>` : '')+
        (m.height ? `<div><dt>身高</dt><dd>${esc(m.height)}cm</dd></div>` : '')+
        (m.birth_place ? `<div><dt>出生地</dt><dd>${esc(m.birth_place)}</dd></div>` : '')+
        (m.join_day ? `<div><dt>加入</dt><dd>${esc(m.join_day)}</dd></div>` : '')+
        `<div><dt>动态提及</dt><dd>约 ${m.mentions || 0} 次</dd></div>`+
        (m.weibo_fans_str ? `<div><dt>微博粉丝</dt><dd>${esc(m.weibo_fans_str)}</dd></div>` : '')+
        (m.hobby ? `<div><dt>爱好</dt><dd>${esc(m.hobby)}</dd></div>` : '')+
        (m.speciality ? `<div><dt>特长</dt><dd>${esc(m.speciality)}</dd></div>` : '')+
        `</dl>`+
        (expItems.length ? `<details class="editorial-fold"><summary>展开完整履历 · ${expItems.length} 条</summary><div class="tl editorial">${expItems.map(t => `<div class="node">${esc(t)}</div>`).join('')}</div></details>` : '');
    }else{
      profile = `<h3 class="member-detail-title">${esc(name)}</h3><p class="hint">已不在现行官方花名册（早期退团/单飞）</p>`;
    }
    return `<div class="member-detail">${profile}${watchPanel(m)}${evidencePanel(m)}${list.length ? `<p class="module-kicker">事件链 · ${list.length} 条</p>${list.map(eventOf).join('')}` : `<p class="hint">暂无事件链记录</p>`}${subjectivePanel(m)}</div>`;
  };

  const groupOrder = ['SNH48','BEJ48','GNZ48','CKG48','CGT48','IDOLS FT'];
  const grouped = {};
  active.forEach(m => { (grouped[m.group || '其他'] ||= []).push(m); });
  const groupNames = groupOrder.filter(g => grouped[g]).concat(Object.keys(grouped).filter(g => !groupOrder.includes(g)));
  let fullRoster = false;

  const memberCard = (m, sub) => {
    const conc = (m.concurrent && m.concurrent.length) ? `<span class="tag conc" title="兼任">兼</span>` : '';
    return `<button class="member-profile" data-key="${keyOf(m)}">${portrait(m)}<span class="name">${esc(m.name)}${conc}</span><span class="count">${esc(sub || '')}</span></button>`;
  };
  const extraCard = n => `<button class="member-profile" data-key="~${esc(n)}"><span class="member-portrait" aria-label="${esc(n)}">${esc(n.slice(-1))}</span><span class="name">${esc(n)}</span><span class="count">退团/单飞</span></button>`;

  const renderGroups = q => {
    let hh = '';
    const qq = (q || '').trim().toLowerCase();
    if(qq){
      const hay = m => [m.name, m.nickname, m.generation, m.group, m.team, (m.concurrent||[]).join(' ')].join(' ').toLowerCase();
      const hit = [...active, ...honor, ...retired].filter(m => qq.split(/\s+/).every(t => hay(m).indexOf(t) >= 0));
      const ex = extraRetired.filter(n => n.toLowerCase().indexOf(qq) >= 0);
      hh += `<h3 class="member-sec-title">搜索结果 · ${hit.length + ex.length} 人</h3>`;
      hh += `<div class="member-index">${hit.map(m => memberCard(m, `${m.group} ${m.team}${m.concurrent.length ? ' · 兼'+m.concurrent.join('/') : ''}`)).join('')}${ex.map(extraCard).join('')}</div>`;
      return hh;
    }
    if(!fullRoster){
      const featured = active.slice().sort((a,b) => stableHash(`${DATA.as_of}|${a.sid}`) - stableHash(`${DATA.as_of}|${b.sid}`)).slice(0, 36);
      hh += `<p class="hint">官方花名册 · 在团 ${active.length} 人。首批成员按日期稳定轮换，不按提及量、粉丝数或指数排序；可搜索全量成员，或按团展开完整花名册。</p>`;
      hh += `<h3 class="member-sec-title">公平轮换成员 · ${featured.length}</h3><div class="member-index">${featured.map(m => memberCard(m, `${m.group} ${m.team}`)).join('')}</div>`;
      hh += `<button class="cta-btn" data-member-view="all">按团浏览全部 ${active.length} 位在团成员 →</button>`;
      return hh;
    }
    hh += `<p class="hint">官方花名册 · 在团 ${active.length} · 荣誉毕业 ${honor.length} · 退团/离团 ${retired.length + extraRetired.length} · 照片为官网公开图 · 兼任标「兼」。</p>`;
    hh += `<h3 class="member-sec-title">在团成员 · ${active.length}</h3>`;
    groupNames.forEach(g => {
      const teams = {};
      grouped[g].forEach(m => (teams[m.team || '未分队'] ||= []).push(m));
      hh += `<div class="member-group"><p class="member-group-name">${esc(g)}</p>`;
      Object.entries(teams).forEach(([team, list]) => {
        list.sort((a,b) => (a.name||'').localeCompare(b.name||'', 'zh'));
        hh += `<details class="member-team"${list.length <= 10 ? ' open' : ''}><summary class="member-team-name">${esc(team)} · ${list.length}</summary><div class="member-index">${list.map(m => memberCard(m, m.generation || '')).join('')}</div></details>`;
      });
      hh += `</div>`;
    });

      const m = roster.find(x => x.name === b.dataset.vname);
      const card = detail.querySelector('.vote-card');
      if(card && m) card.outerHTML = votePanel(m);
      bindVote();
    }));
    detail.querySelectorAll('[data-vact]').forEach(b => b.addEventListener('click', () => {
      const act = b.dataset.vact;
      const v = loadVotes();
      if(act === 'clear'){
        const nm = b.dataset.vmember;
        delete v[nm];
        saveVotes(v);
        const m = roster.find(x => x.name === nm);
        const card = detail.querySelector('.vote-card');
        if(card && m) card.outerHTML = votePanel(m);
        bindVote();
        return;
      }
      const js = JSON.stringify({ schema_version:'1.0.0', source:'community-vote', votes:v }, null, 2);
      if(act === 'copy'){
        if(navigator.clipboard && typeof navigator.clipboard.writeText === 'function'){
          navigator.clipboard.writeText(js).then(() => alert('已复制投票 JSON，粘贴给编辑即可合并。')).catch(() => prompt('复制失败，请手动复制：', js));
        }else{
          prompt('当前环境不支持剪贴板，请手动复制：', js);
        }
      }else{
        const blob = new Blob([js], {type:'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'votes.json';
        a.click();
        URL.revokeObjectURL(a.href);

    el.querySelectorAll('#member-groups [data-key]').forEach(btn => btn.addEventListener('click', () => {
      el.querySelectorAll('#member-groups [data-key]').forEach(x => x.classList.toggle('on', x === btn));

    if(trigger) trigger.addEventListener('click', () => {

  window.show48Member = key => {

/* ---- 现役成员数据指数 ---- */
function renderRanking(){
  const el = document.getElementById('rank');
  const roster = (DATA.roster || []).filter(m => m.status === 'active');
  const indexMeta = DATA.member_index || {};
  const PAGE = 24;
  let rankShown = PAGE;

  const scoreOf = m => (m.rating && typeof m.rating.rank_score === 'number') ? m.rating.rank_score : null;
  const coverageOf = m => m.rating && typeof m.rating.objective_coverage === 'number' ? m.rating.objective_coverage : 0;
  const sorted = roster.slice().sort((a,b) => {
    const sa = scoreOf(a), sb = scoreOf(b);
    if(sa == null && sb == null) return (a.name||'').localeCompare(b.name||'','zh');
    if(sa == null) return 1;
    if(sb == null) return -1;
    if(sb !== sa) return sb - sa;
    return coverageOf(b) - coverageOf(a);
  });
  const portrait = m => m.avatar
    ? `<span class="member-portrait"><img src="${esc(m.avatar)}" alt="${esc(m.name)}" loading="lazy" onerror="this.onerror=null;this.parentElement.textContent='${esc(m.name.slice(-1))}';"></span>`
    : `<span class="member-portrait" aria-label="${esc(m.name)}">${esc(m.name.slice(-1))}</span>`;

  const rowOf = (m, i) => {
    const sc = scoreOf(m);
    const coverage = coverageOf(m);
    const sub = `${esc(m.group||'')} ${esc(m.team||'')}${m.concurrent && m.concurrent.length ? ' · 兼'+esc(m.concurrent.join('/')) : ''}`;
    const conc = (m.concurrent && m.concurrent.length) ? `<span class="conc">兼</span>` : '';
    const num = i + 1;
    const cls = num <= 3 ? ` r${num}` : '';
    const scoreTxt = sc == null ? `<span class="rank-score empty">数据不足</span>` : `<span class="rank-score">${sc}</span>`;
    return `<a class="rank-row${cls}" href="members.html#member-s${esc(m.sid)}">`+
      `<span class="rank-num">${num}</span>${portrait(m)}`+
      `<span class="rank-info"><span class="rank-name">${esc(m.name)}${conc}</span><span class="rank-sub">${sub}</span></span>`+
      `<span class="rank-right">${scoreTxt}<span class="rank-coverage">数据覆盖 ${coverage}%</span></span></a>`;
  };

  const render = () => {
    const shown = sorted.slice(0, rankShown);
    const complete = sorted.filter(m => scoreOf(m) != null).length;
    const cutoff = indexMeta.as_of || DATA.as_of || '—';
    const windowDays = indexMeta.window_days || 90;
    const rankedCount = indexMeta.counts?.ranked_members ?? complete;
    let h = `<div class="rank-intro"><h2>现役成员数据指数</h2>`+
      `<p>测试版 · 仅比较现役成员的可核验数据基础，不把业务、颜值、CP 或公众投票混入排序。</p>`+
      `<div class="rank-method"><strong>当前口径：</strong>${windowDays} 天窗口，数据截至 ${esc(cutoff)}。已接入官方活动/作品、微博粉丝快照、媒体影响与跨平台覆盖；至少 60% 权重有证据才出基线值。</div></div>`;
    h += `<details class="fold"><summary>查看口径与公众参与边界</summary><p class="hint">后续公众只能参与独立的“社区观察样本”，不改写此页客观排序。对外发布前会补充多平台互动、公演/活动、数据截止日和样本审计。</p></details>`;
    h += `<div class="rank-meta">现役 ${roster.length} 人 · 当前可比较 ${rankedCount} 人 · ${complete < 20 ? '数据覆盖仍在补齐' : `已展示 ${shown.length} 人 · 点击成员查看完整事实卡。`}</div>`;
    if(complete < 20){
      h += `<div class="rank-readiness"><strong>数据建设中，暂不发布全员名次</strong><p>当前仅 ${complete} / ${roster.length} 位现役成员达到 60% 数据覆盖门槛。完成官方公演/活动、个人平台互动与跨平台证据补齐后，才会生成可公开比较的指数。</p></div>`;
      el.innerHTML = h;
      return;
    }
    h += `<div class="rank-list">${shown.map(rowOf).join('')}</div>`;
    if(shown.length < sorted.length) h += `<button class="rank-more" data-more>加载更多（+${PAGE}）</button>`;
    el.innerHTML = h;
    const more = el.querySelector('[data-more]');
    if(more) more.addEventListener('click', () => { rankShown += PAGE; render(); });
  };
  render();
}

/* ---- 搜索 ---- */
const CH_CLS = { o:'official', m:'media', b:'bilibili', q:'bilibili-bej', n:'bilibili-gnz', u:'bilibili-cgt', d:'douban', t:'tieba', h:'tieba-hg', g:'tieba-gnz', e:'tieba-bej', k:'tieba-ckg', c:'tieba-cgt', z:'tieba-sh', w:'weibo', s:'weibo-super', p:'msg48' };
const CH_FULL = { o:'官网', m:'媒体', b:'B站', q:'BEJ48', n:'GNZ48', u:'CGT48', d:'豆瓣', t:'贴吧', h:'生个女孩吧', g:'GNZ48吧', e:'BEJ48吧', k:'CKG48吧', c:'CGT48吧', z:'塞纳河48吧', w:'微博', s:'超话', p:'口袋48/msg48' };
function runSearch(q){
  const qq = q.toLowerCase();
  const terms = [qq];
  const aliasHit = [];
  const al = DATA.search.aliases || {};
  const rv = DATA.search.rev || {};
  for(const k in al){ if(k.toLowerCase() === qq){ terms.push(al[k].toLowerCase()); aliasHit.push(k + ' → ' + al[k]); } }
  for(const name in rv){ if(name.toLowerCase() === qq){ rv[name].forEach(k => { terms.push(k.toLowerCase()); aliasHit.push(name + ' → ' + k); }); } }
  const uniq = [...new Set(terms)];
  const hits = [];
  for(const it of (DATA.search.items || [])){
    const text = ((it[2]||'') + ' ' + (it[4]||'')).toLowerCase();
    for(const t of uniq){ if(text.indexOf(t) >= 0){ hits.push(it); break; } }
  }
  hits.sort((a,b) => (b[0]||'').localeCompare(a[0]||''));
  return { hits: hits.slice(0, 50), alias: aliasHit };
}
function renderSearch(){
  const el = document.getElementById('search');
  let h = `<h2>搜索</h2><p class="hint">全量 ${DATA.search.count} 条（官网历史 + 多源）· 支持黑话：搜「水水」命中「杨冰怡」。</p>`;
  h += `<div class="search-bar"><input class="search-input" id="searchInput" placeholder="输入关键词，回车搜索…" autocomplete="off"></div>`;
  h += `<div class="search-hint" id="searchHint"></div><div id="searchResults"></div>`;
  el.innerHTML = h;
  const input = el.querySelector('#searchInput');
  const hint = el.querySelector('#searchHint');
  const res = el.querySelector('#searchResults');
  const doSearch = () => {
    const q = (input.value || '').trim();
    if(!q){ hint.innerHTML = ''; res.innerHTML = ''; return; }
    const r = runSearch(q);
    hint.innerHTML = r.alias.length ? r.alias.map(a => `<span class="search-alias">${esc(a)}</span>`).join('') : '';
    if(!r.hits.length){ res.innerHTML = `<div class="empty">无匹配，换个关键词或成员真名试试</div>`; return; }
    let out = `<div class="search-count">${r.hits.length} 条结果（时间倒序 · 最多 50）</div>`;
    r.hits.forEach(x => {
      const [date, ch, title, url, summary] = x;
      const fullUrl = url.startsWith('~') ? 'https://www.snh48.com/html/' + url.slice(1) : url;
      out += `<div class="news"><span class="ch ${CH_CLS[ch]||''}">${esc(CH_FULL[ch]||ch)}</span><span class="tag act">${esc(date)}</span>` +
        `<div class="h"><a href="${esc(fullUrl)}" target="_blank" rel="noopener">${esc(title)}</a></div>` +
        (summary ? `<div class="d">${esc(summary)}</div>` : '') + `</div>`;
    });
    res.innerHTML = out;
  };
  input.addEventListener('keyup', e => { if(e.key === 'Enter') doSearch(); });
  input.addEventListener('input', () => { if(!input.value.trim()) doSearch(); });
}

function renderCalendar(){
  const el = document.getElementById('calendar');
  const C = DATA.calendar || {};
  const counts = C.counts || {};
  const STATUS = {active:'现役', honor:'荣誉', retired:'已退团'};
  const SCLS = {active:'act', honor:'v-low', retired:''};
