  (C.months || []).forEach(mo => (mo.members || []).forEach(m => all.push(m)));
  const start = new Date(); start.setHours(0,0,0,0);
  const daysTo = b => {
    const parts = String(b || '').split('.');
    const M = parseInt(parts[0], 10), D = parseInt(parts[1], 10);
    if(!M || !D) return 999;
    const t = new Date(start.getFullYear(), M - 1, D);
    if(t < start) t.setFullYear(t.getFullYear() + 1);
    return Math.round((t - start) / 86400000);
  };
  const when = d => d === 0 ? '今天' : (d === 1 ? '明天' : d + ' 天后');
  const who = m => [m.g, m.t, m.b, m.z].filter(Boolean).join(' · ');
  const card = m => `<div class="pick-card"><span class="pick-title">${esc(m.n)} ` +
    `<span class="tag ${SCLS[m.s] || ''}">${esc(STATUS[m.s] || '—')}</span></span>` +
    `<span class="pick-why">${esc(who(m))}</span></div>`;

  let h = `<h2>应援日历</h2>`;
  h += `<p class="hint">${esc(C.date_format || 'MM.DD')} · 快照 ${esc(C.snapshot || '—')} · 来源 ${esc(C.source || '官方成员列表')}。字段与<a href="members.html">成员档案</a>同源，不新增任何推断值。</p>`;
  h += `<div class="cal-stats">`;
  [['在册总人数', counts.total], ['有生日记录', counts.dated], ['现役', counts.active],
   ['荣誉毕业', counts.honor], ['已退团', counts.retired], ['官方未公布', counts.undated]]
    .forEach(p => { h += `<div class="cal-stat"><b>${esc(String(p[1] ?? '—'))}</b><span>${esc(p[0])}</span></div>`; });
  h += `</div>`;

  /* 筛选条放在预告之上：一个筛选同时作用于「今天/未来 30 天」与「全年档案」。
     放在档案上方会导致上方的预告不跟着变，读起来像两套互不相干的数。 */
  h += `<h3 class="pick-name">按状态与分团筛选（同时作用于下方预告与档案）</h3>`;
  h += `<div class="cats" id="calStatus">` +
    [['all', '全部', counts.dated], ['active', '现役', counts.active], ['honor', '荣誉', counts.honor], ['retired', '已退团', counts.retired]]
      .map(s => `<button class="cat-chip${s[0] === 'all' ? ' on' : ''}" data-cal-status="${s[0]}">${s[1]} ${s[2]}</button>`).join('') + `</div>`;
  h += `<div class="cats" id="calGroup">` + [['all', '所有分团']].concat((C.groups || []).map(g => [g.label, g.label]))
    .map(g => `<button class="cat-chip${g[0] === 'all' ? ' on' : ''}" data-cal-group="${esc(g[0])}">${esc(g[1])}</button>`).join('') + `</div>`;

  h += `<div id="calNear"></div>`;

  if((C.signs || []).length){
    h += `<h3 class="pick-name">星座分布</h3><div class="cal-bars">` +
      C.signs.map(s => `<span class="cal-bar">${esc(s.label)} ${s.count}</span>`).join('') + `</div>`;
  }
  if((C.groups || []).length){
    h += `<h3 class="pick-name">分团构成</h3><div class="cal-bars">` +
      C.groups.map(g => `<span class="cal-bar">${esc(g.label)} ${g.count}</span>`).join('') + `</div>`;
  }

  h += `<h3 class="pick-name">全年生日档案</h3><div id="calArchive"></div>`;
  if((C.undated_sample || []).length){
    h += `<p class="cal-note">官方列表未公布生日的 ${counts.undated} 位未列入（例如 ${C.undated_sample.map(esc).join('、')}）；这里不用推测值补位。</p>`;
  }
  h += `<p class="cal-note">默认含已退团成员：官方 App 只展示在团成员，这是本站档案口径与官方唯一的差别，只想看现役就点上方的「现役」。生日应援请遵守剧场与公演规定，不打扰成员私人生活；本页不排名、不评价成员价值。</p>`;
  el.innerHTML = h;

  let curStatus = 'all', curGroup = 'all';
  const near = el.querySelector('#calNear');
  const host = el.querySelector('#calArchive');
  const pass = m => (curStatus === 'all' || m.s === curStatus) && (curGroup === 'all' || m.g === curGroup);

  const drawNear = () => {
    const pool = all.filter(pass);
    const today = pool.filter(m => daysTo(m.b) === 0).sort((a, b) => String(a.b).localeCompare(String(b.b)));
    const upcoming = pool.map(m => ({m: m, d: daysTo(m.b)}))
      .filter(x => x.d > 0 && x.d <= 30)
      .sort((a, b) => a.d - b.d || String(a.m.b).localeCompare(String(b.m.b)));
    let s = '';
    if(today.length){
      s += `<div class="cal-today"><strong>今天生日 · ${today.length} 位</strong><p>${today.map(m => esc(m.n + '（' + who(m) + '）')).join('、')}</p></div>`;
    } else {
      s += `<div class="cal-today"><strong>今天没有符合条件的成员生日</strong><p>下方是接下来 30 天的名单。</p></div>`;
    }
    /* 按日期归并：30 天内约有 60 位成员，平铺成 60 个 chip 读不出节奏，
       聚成约 25 个「日期行」才像一条时间轴。upcoming 已按天数升序，插入顺序即日期顺序。 */
    const seen = new Map();
    const byDate = [];
    upcoming.forEach(x => {
      if(!seen.has(x.m.b)){ seen.set(x.m.b, {d: x.d, names: []}); byDate.push([x.m.b, seen.get(x.m.b)]); }
      seen.get(x.m.b).names.push(x.m.n);
    });
    if(byDate.length){
      s += `<h3 class="pick-name">接下来 30 天 · ${upcoming.length} 位 / ${byDate.length} 个日期</h3><div class="cal-days">` +
        byDate.map(([b, v]) => `<div class="cal-day"><b>${esc(b)}</b><span class="cal-when">${esc(when(v.d))}</span>` +
          `<span class="cal-names">${v.names.map(esc).join('、')}</span></div>`).join('') + `</div>`;
    } else {
      s += `<p class="cal-note">当前筛选下，接下来 30 天没有生日记录。</p>`;
    }
    near.innerHTML = s;
  };

  const curMonthNo = start.getMonth() + 1;
  const drawArchive = () => {
    const months = (C.months || []).map(mo => {
      const list = (mo.members || []).filter(pass);
      return {m: mo.m, label: mo.label, list: list};
    }).filter(mo => mo.list.length);
    if(!months.length){ host.innerHTML = `<div class="empty">当前筛选下没有记录</div>`; return; }
    const total = months.reduce((n, mo) => n + mo.list.length, 0);
    /* 按月折叠：全部 715 条一次展开会渲染 715 张卡，移动端首屏压力极大；
       默认只展开当前月，其余按月折叠并显示人数。 */
    host.innerHTML = `<p class="cal-note">当前筛选共 ${total} 位，按月份折叠，点月份展开（默认展开当前月）。</p>` +
      months.map(mo => `<details class="cal-month"${mo.m === curMonthNo ? ' open' : ''}>` +
        `<summary><span class="cal-month-label">${esc(mo.label)}</span><span class="cal-month-count">${mo.list.length} 位</span></summary>` +
        `<div class="pick-grid">${mo.list.map(card).join('')}</div></details>`).join('');
  };

  const redraw = () => { drawNear(); drawArchive(); };
  redraw();
  el.addEventListener('click', event => {
    const s = event.target.getAttribute && event.target.getAttribute('data-cal-status');
    const g = event.target.getAttribute && event.target.getAttribute('data-cal-group');
    if(!s && !g) return;
    if(s) curStatus = s;
    if(g) curGroup = g;
    el.querySelectorAll('[data-cal-status]').forEach(b => b.classList.toggle('on', b.getAttribute('data-cal-status') === curStatus));
    el.querySelectorAll('[data-cal-group]').forEach(b => b.classList.toggle('on', b.getAttribute('data-cal-group') === curGroup));
    redraw();
  });
}

/* ---- 入河手册（术语 / 机制 / 风险边界） ---- */
function renderGuide(){
  const el = document.getElementById('guide');
  const G = DATA.guide || {};
  let h = `<h2>入河手册</h2>`;
  if(G.disclaimer) h += `<div class="guide-disclaimer">${esc(G.disclaimer)}</div>`;
  const srcMap = {};
  (G.sources || []).forEach(s => { if(s.key) srcMap[s.key] = s; });
  (G.sections || []).forEach(sec => {
    h += `<div class="guide-block${sec.tone === 'warn' ? ' redline' : ''}"><h3>${esc(sec.title || '')}</h3>`;
    if(sec.desc) h += `<p>${esc(sec.desc)}</p>`;
    (sec.items || []).forEach(it => {
      const body = `<p>${esc(it.text || '')}</p>`;
      /* 出处能落到 sources[] 里带 URL 的条目时渲染成可点的「原文」，
         查不到的（如未收录 URL 的转载稿）就只留文字，不编造链接。 */
      const ref = it.src ? srcMap[it.src] : null;
      const meta = [it.source, it.year].filter(Boolean).join(' · ');
      const src = meta
        ? `<span class="guide-src">来源：${esc(meta)}` +
          (ref && ref.url ? ` · <a href="${esc(ref.url)}" target="_blank" rel="noopener">原文</a>` : '') +
          `</span>`
        : '';
      h += sec.tone === 'warn'
        ? `<div class="guide-warn"><b>${esc(it.term || '')}</b>${body}${src}</div>`
        : `<div class="guide-term"><b>${esc(it.term || '')}</b>${body}${src}</div>`;
    });
    h += `</div>`;
  });
  if((G.sources || []).length){
    h += `<div class="guide-block"><h3>出处清单</h3><ul class="guide-sources">` +
      G.sources.map(s => `<li>${esc([s.name, s.year, s.about].filter(Boolean).join(' · '))}` +
        (s.url ? ` · <a href="${esc(s.url)}" target="_blank" rel="noopener">原文</a>` : '') + `</li>`).join('') + `</ul></div>`;
  }
  h += `<p class="cal-note">本页只做机制说明与风险提示，不代管交易、不组织集资、不为任何第三方背书。</p>`;
  el.innerHTML = h;
}

const sectionRenderers = {
  brief: renderBrief,
  discover: renderDiscover,
  clips: renderClips,
  contribute: renderContribute,
  feed: renderFeed,
  hot: renderHot,
  stories: renderStories,
  gua: renderGua,
  rank: renderRanking,
  career: renderCareer,
  members: renderMemberEvents,
  search: renderSearch,
  picks: renderPicks,
  curated: renderCurated,
  calendar: renderCalendar,
  guide: renderGuide,
  about: renderAbout,
};
const renderedSections = new Set();
function ensureSection(id){
  if(renderedSections.has(id) || !sectionRenderers[id]) return;
  sectionRenderers[id]();
  renderedSections.add(id);
}
const initialSection = pageSection(PAGE_ID);
ensureSection(initialSection);
const requestedSection = (location.hash || '').slice(1);
if(requestedSection) requestAnimationFrame(() => {
  const target = document.getElementById(requestedSection);
  if(target){
    for(let parent=target.parentElement; parent; parent=parent.parentElement){ if(parent.tagName==='DETAILS') parent.open=true; }
    target.scrollIntoView({block:'start'});
  }
});
if(requestedSection && document.getElementById(requestedSection)) requestAnimationFrame(() => {
  document.getElementById(requestedSection)?.scrollIntoView({block:'start'});
});

  `<span>日报 ${esc(DATA.site_status?.latest_daily || '未知')}</span>`+

  `<div class="bsz-row">`+

  `<span id="busuanzi_container_site_uv" class="bsz" style="display:none">访客 <b id="busuanzi_value_site_uv"></b></span>`+
  `<span id="busuanzi_container_page_pv" class="bsz" style="display:none">本页 <b id="busuanzi_value_page_pv"></b></span>`+
