(function initTheme(){
  const SKINS = ['light','mint','dark'];
  const NEXT_LABEL = { light:'🌱 薄荷', mint:'◐ 深色', dark:'☀️ 浅色' };
  let saved = null;
  try { saved = localStorage.getItem('48hot-theme'); } catch(e){}
  if(!SKINS.includes(saved)) saved = null;
  const skin = saved || 'light';
  document.documentElement.setAttribute('data-skin', skin);
  const btn = document.getElementById('themeToggle');
  if(!btn) return;
  const cur = () => document.documentElement.getAttribute('data-skin');
  const label = () => { btn.textContent = NEXT_LABEL[cur()] || '☀️ 浅色'; };
  label();
  btn.addEventListener('click', () => {
    const i = SKINS.indexOf(cur());
    const next = SKINS[(i + 1) % SKINS.length];
    document.documentElement.setAttribute('data-skin', next);
    try { localStorage.setItem('48hot-theme', next); } catch(e){}
    label();
  });
})();

const compactTitle = (value, limit = 58) => {
  const plain = String(value || '')
    .replace(/#[^#\n]{1,42}#/g, ' ')
    .replace(/[\u200b\u200c\u200d]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
  return plain.length > limit ? plain.slice(0, limit).trimEnd() + '…' : plain;
};
const stableHash = value => {
  let hash = 2166136261;
  for(const char of String(value || '')){ hash ^= char.charCodeAt(0); hash = Math.imul(hash, 16777619); }
  return hash >>> 0;
};

  let saved = 'auto';

  const apply = mode => {
    if(mode === 'auto') document.documentElement.removeAttribute('data-layout');
    else document.documentElement.setAttribute('data-layout', mode);
    if(select) select.value = mode;
  };
  apply(saved);
  if(select) select.addEventListener('change', () => {

  });

/* 多页面频道导航：每个栏目拥有独立 URL，卡片跳转也跨页保留锚点。 */
const PAGE_PATHS = {
  home:'index.html', brief:'index.html', discover:'discover.html', clips:'clips.html', contribute:'contribute.html', feed:'feed.html', hot:'hot.html', stories:'stories.html',
  gua:'gua.html', rank:'rank.html', career:'career.html', members:'members.html', search:'search.html',
  picks:'picks.html', curated:'curated.html', about:'about.html'
};
/* 社区证据使用一页一记录的稳定 URL；非社区栏目仍保留原有锚点分享。 */
const slicePage = id => String(id || '').startsWith('slice-') ? 'slices/' + String(id) + '.html' : '';
const pageSection = id => id === 'home' ? 'brief' : id;
(function pages(){
  const links = Array.from(document.querySelectorAll('#tabs a'));
  const activate = page => links.forEach(a => {
    const active = a.dataset.page === page;
    a.classList.toggle('on', active);
    if(active) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  });
  activate(PAGE_ID);
  window.show48Section = (id, anchor) => {
    const targetPage = PAGE_PATHS[id] ? id : 'home';
    const currentSection = pageSection(PAGE_ID);
    if(pageSection(targetPage) !== currentSection){
      const path = PAGE_PATHS[targetPage];
      window.location.href = path + (anchor ? '#'+anchor : '');
      return;
    }
    ensureSection(currentSection);
    const target = document.getElementById(anchor || currentSection);
    if(anchor) history.replaceState(null, '', '#'+anchor);
    target?.scrollIntoView({ behavior:'smooth', block:'start' });
  };
})();

const shareSlice = async button => {
  const anchor = button.dataset.shareId || '';
  const page = slicePage(anchor) || button.dataset.sharePage || PAGE_PATHS[PAGE_ID] || location.pathname.split('/').pop() || 'index.html';
  const url = new URL(page, location.href);
  if(anchor && !slicePage(anchor)) url.hash = anchor;
  const payload = {title: button.dataset.shareTitle || '48HOT 内容切片', text: button.dataset.shareText || '来自 48HOT 的可追溯内容切片', url: url.href};
  try{
    let message = '已复制链接';
    if(navigator.share && /^https?:/.test(url.protocol)){ await navigator.share(payload); message = '已分享'; }
    else if(navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(url.protocol === 'file:' ? payload.title + '\n本地预览地址（仅本机可用）：' + url.href : url.href);
    else prompt('复制这个链接：', url.href);
    button.textContent = message;
    setTimeout(() => { button.textContent = button.dataset.shareLabel || '分享切片'; }, 1800);
  }catch(error){
    if(error && error.name !== 'AbortError') prompt('分享失败，请手动复制：', url.href);
  }
};
function bindShare(root=document){
  root.querySelectorAll('[data-share-id]').forEach(button => {
    if(button.dataset.shareBound) return;
    button.dataset.shareBound = '1';
    button.dataset.shareLabel = button.textContent;
    button.addEventListener('click', () => shareSlice(button));
  });
}

function bindJumps(root){
  root.querySelectorAll('[data-section]').forEach(btn => btn.addEventListener('click', () => {
    window.show48Section(btn.dataset.section, btn.dataset.anchor || '');
  }));
}

let sliceFilter = 'all';
let sliceShown = 24;
let sliceLinkResolved = false;
function renderClips(){
  const el = document.getElementById('clips');

    const target = slices.findIndex(item => '#' + item.id === location.hash);

  const filtered = sliceFilter === 'all' ? slices : slices.filter(item => item.content_type === sliceFilter);
  const shown = filtered.slice(0, sliceShown);
  let h = `<div class="discovery-intro"><div><h2>作品与成长切片</h2><p>“切片”是一条可以单独引用的公开记录：它保留成员、上下文、来源、日期和验证状态。点击分享得到稳定锚点，而不是脱离出处的截图。</p></div><aside class="discovery-rule"><strong>收录边界</strong>${esc(ARCHIVE.methodology?.slice_rule || '')}</aside></div>`;

  if(shown.length < filtered.length) h += `<button class="rank-more" data-slice-more>加载更多（还有 ${filtered.length-shown.length} 条）</button>`;
  el.innerHTML = h;
  bind();

const CH_NAME = { official:'官网', bilibili:'B站', 'bilibili-bej':'BEJ48', 'bilibili-gnz':'GNZ48', 'bilibili-cgt':'CGT48', weibo:'微博', 'weibo-super':'超话', media:'媒体', msg48:'口袋48/msg48', tieba:'贴吧', 'tieba-hg':'生个女孩吧', 'tieba-gnz':'GNZ48吧', 'tieba-bej':'BEJ48吧', 'tieba-ckg':'CKG48吧', 'tieba-cgt':'CGT48吧', 'tieba-sh':'塞纳河48吧', douban:'豆瓣' };
let feedDays = 7;
let feedPage = 1;
const FEED_PAGE_SIZE = 20;
let feedLinkResolved = false;
function renderFeed(){
  const el = document.getElementById('feed');
  const F = DATA.feed || {};
  const all7 = F.days7 || [];
  const all30 = F.days30 || [];
  const isFolk = x => /tieba|douban/.test(x.channel || '');
  const news7 = all7.filter(x => !isFolk(x));
  const news30 = all30.filter(x => !isFolk(x));
  if(!feedLinkResolved){
    const target = news30.findIndex(item => '#feed-' + stableHash(item.url) === location.hash);
    if(target >= 0){ feedDays = 30; feedPage = Math.floor(target / FEED_PAGE_SIZE) + 1; }
    feedLinkResolved = true;
  }
  const list = feedDays===7 ? news7 : news30;
  let h = `<h2>今日动态</h2><p class="hint">近 ${feedDays} 天已核实动态 · 时间倒序 · 来源：官网 / B站 / 微博 / 媒体。贴吧/豆瓣讨论与瓜料见「厕所瓜」。</p>`;
  h += `<div class="cats">` +
    `<button class="cat-chip${feedDays===7?' on':''}" data-days="7">近 7 天（${news7.length} 条）</button>` +
    `<button class="cat-chip${feedDays===30?' on':''}" data-days="30">近 30 天（${news30.length} 条）</button>` +
    `</div>`;
  const totalPages = Math.max(1, Math.ceil(list.length / FEED_PAGE_SIZE));
  if(feedPage > totalPages) feedPage = totalPages;
  const start = (feedPage-1)*FEED_PAGE_SIZE;
  const pageItems = list.slice(start, start+FEED_PAGE_SIZE);
  const by = {};
  pageItems.forEach(x=>{ (by[x.date] ||= []).push(x); });
  const days = Object.keys(by).sort().reverse();
  let body = '';
  days.forEach(day=>{
    body += `<div class="day">${esc(day)}（${by[day].length} 条）</div>`;
    by[day].forEach(x=>{
      const itemId = `feed-${stableHash(x.url)}`;
      const officialSource = /^(official|weibo|bilibili)/.test(x.channel || '');
      const media = x.image_url ? `<div class="news-thumb"><img src="${esc(x.image_url)}" alt="${esc(x.image_alt || x.title)}" loading="lazy"></div>` : '';
      body += `<article class="news${x.image_url ? ' news-with-media' : ''}" id="${itemId}">${media}<div class="news-copy">` +
        `<span class="ch ${esc(x.channel)}">${esc(CH_NAME[x.channel]||x.channel)}</span>` +
        statusBadge(officialSource?'official':'public',officialSource?'官方来源':'公开来源')+
        (x.signal==='rumor' ? `<span class="tag v-low">瓜</span>` : ``) +
        (x.time ? `<span class="tag act">${esc(x.time)}</span>` : ``) +
        `<div class="h"><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a></div>` +
        (x.summary && x.summary !== x.title ? `<div class="d">${esc(x.summary)}</div>` : ``) +
        `<div class="d">${x.source ? esc(x.source)+' · ' : ''}<a class="u" href="${esc(x.url)}" target="_blank" rel="noopener">原文 ↗</a> · <button class="jump-link" data-share-id="${itemId}" data-share-page="feed.html" data-share-title="${esc(x.title)}">分享切片</button></div></div></article>`;
    });
  });
  if(!list.length) body = `<div class="empty">窗口内暂无动态</div>`;
  body += `<div class="pager">` +
    `<button class="pager-btn" data-pg="prev"${feedPage<=1?' disabled':''}>‹ 上一页</button>` +
    `<span class="pager-info">${feedPage} / ${totalPages} 页 · ${list.length} 条</span>` +
    `<button class="pager-btn primary" data-pg="next"${feedPage>=totalPages?' disabled':''}>下一页 ›</button>` +
    `</div>`;
  el.innerHTML = h + body;
  el.querySelectorAll('.cat-chip').forEach(b=>{
    b.addEventListener('click', ()=>{
      feedDays = Number(b.dataset.days);
      feedPage = 1;
      renderFeed();
    });
  });
  el.querySelectorAll('.pager-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      feedPage += b.dataset.pg==='prev' ? -1 : 1;
      renderFeed();
      el.scrollIntoView({ behavior:'smooth', block:'start' });
    });
  });
  bindShare(el);
}

/* ===== 48日报（AIHOT 式：时间线 + 日期归档，每日 9 点更新一期）===== */
const REPORT_ORDER = ['official','media','weibo','bilibili','bilibili-bej','bilibili-gnz','bilibili-cgt','weibo-super','weibo-hot','tieba-hg','tieba','douban'];
const REPORT_ACTION_RANK = { '公布':1, '夺冠':2, '落幕':3, '开启':4, '官宣':4, '首演':5, '公告':6, '入围':7, '资讯':9 };
const reportToday = () => {
  const arc = DATA.brief?.archive || [];
  return (arc[0] && arc[0].brief_date) || DATA.brief?.brief_date || DATA.as_of;
};
const reportViewpoints = latest => {
  // 今日看点：正式来源优先，同来源取时间最新，最多 5 条；贴吧/豆瓣纯讨论不上看点
  const formal = (latest || []).filter(x => !/tieba|douban/.test(x.channel || ''));
  const seen = new Set();
  const out = [];
  formal.sort((a, b) => {
    const ra = REPORT_ACTION_RANK[a.action] || 9, rb = REPORT_ACTION_RANK[b.action] || 9;
    if(ra !== rb) return ra - rb;
    return REPORT_ORDER.indexOf(a.channel) - REPORT_ORDER.indexOf(b.channel);
  });
  for(const x of formal){
    if(out.length >= 5) break;
    if(seen.has(x.channel)) continue;
    seen.add(x.channel);
    out.push(x);
  }
  if(out.length < 3) out.push(...formal.filter(x => !out.includes(x)).slice(0, 3 - out.length));
  return out.slice(0, 5);
};
const reportTimeline = latest => {
  // 时间线：按日期分组（日期记录），组内按时辰倒序
  const groups = [];
  const byDay = {};
  (latest || []).filter(x => !/tieba|douban/.test(x.channel || '')).forEach(x => {
    const d = (x.published_at || '').slice(0, 10) || '未知日期';
    (byDay[d] = byDay[d] || []).push(x);
  });
  Object.keys(byDay).sort().reverse().forEach(d => {
    const items = byDay[d].sort((a, b) => ((b.published_at_tz || '') < (a.published_at_tz || '') ? -1 : 1));
    groups.push({ date: d, items });
  });
  return groups;
};

          `<span class="rp-m">${esc(x.summary || '')}</span></div>`;
      });

  }
  h += `</section>`;
  h += `<section class="rp-extra"><div class="rp-sec">事件进展</div><div class="rp-extra-cols">`;

    h += `<div class="rp-extra-item"><span class="rp-extra-t">${jump(e.event, 'stories', storyAnchor(e))}</span><span class="rp-extra-m">${esc(e.latest)}</span></div>`;
  });
  h += `</div></section>`;
  h += `<section class="rp-extra"><div class="rp-sec">今日热点</div><div class="rp-extra-cols">`;

  });

  h += `<p class="rp-foot">48日报 · 每日 09:00 由「采集 → 策展 → 热点 → 事件 → 简报」流水线生成一期，非实时刷新；可用上方日期切换往期正文。</p>`;
  h += `</div>`;

/* ---- 热点 ---- */
let hotTier = 'all';
function renderHot(){
  const el = document.getElementById('hot');
  const all = DATA.hot_topics || [];
  const topics = all.filter(t => hotTier === 'all' || t.tier === hotTier);
  const tierLabel = t => t==='P0' ? '重点' : (t==='P1' ? '关注' : '常规');
  const CH = {official:'官网', weibo:'微博', bilibili:'B站', media:'媒体', 'bilibili-bej':'BEJ', 'bilibili-gnz':'GNZ', 'bilibili-cgt':'CGT', 'weibo-hot':'热搜', 'weibo-super':'超话', 'tieba-hg':'生个女孩吧', tieba:'贴吧', douban:'豆瓣', zhihu:'知乎'};
  const bodyFold = list => list && list.length
    ? `<details class="editorial-fold"><summary>收录正文 ${list.length} 篇</summary>` + list.map(b =>
      `<div class="news"><div class="h">${esc(b.title)}</div><div class="d">${esc(b.summary || '')}</div>`+
      `<details class="editorial-fold"><summary>阅读正文</summary><div class="body-txt">${esc(b.body)}</div></details></div>`).join('') + `</details>`
    : '';
  const trendHtml = t => {
    const d = t.trend_delta || 0;
    if (t.trend === 'new') return `<span class="trend t-new">● 新</span>`;
    if (t.trend === 'up') return `<span class="trend t-up">↗ ${d > 0 ? '+' + d : d}</span>`;
    if (t.trend === 'down') return `<span class="trend t-down">↘ ${d < 0 ? d : '-' + d}</span>`;
    return `<span class="trend t-flat">→ 平</span>`;
  };
  const indexHtml = t => {
    const n = Math.max(0, Math.min(100, t.hot_index || 0));
    return `<span class="hot-index"><span class="hi-num">${n}</span><span class="hi-track"><i style="width:${n}%"></i></span></span>`;
  };
  const srcHtml = t => {
    const names = (t.channels || []).map(c => CH[c] || c);
    const parts = [`${t.channel_count} 源`, `${t.item_count} 条`];
    if (t.has_top) parts.push('官方置顶');
    return `<span class="hi-src">${parts.join(' · ')}${names.length ? ' · ' + names.slice(0,4).join('/') + (names.length>4?'…':'') : ''}</span>`;
  };
  const leadOf = t => `<article class="hot-lead" id="${esc(t.anchor_id)}">`+
    `<div class="hot-head"><span class="rank r${t.rank}">${t.rank}</span><div class="hot-main">`+
    `<div class="ttl" title="${esc(t.title)}">${esc(compactTitle(t.title, 66))}</div><div class="why">${esc(t.why_hot)}</div>`+
    `<div class="hot-metrics"><span class="tag ${tierTag(t.tier)}">${tierLabel(t.tier)}</span>${indexHtml(t)}${trendHtml(t)}${srcHtml(t)}<span class="hi-time">${esc(t.latest_at)}</span></div>`+
    `</div></div>${bodyFold(t.bodies)}</article>`;
  const rowOf = t => `<article class="hot-row" id="${esc(t.anchor_id)}"><span class="rank r${t.rank}">${t.rank}</span>`+
    `<div class="hot-main"><div class="ttl" title="${esc(t.title)}">${esc(compactTitle(t.title, 58))}</div>`+
    `<div class="hot-metrics">${indexHtml(t)}${trendHtml(t)}${srcHtml(t)}<span class="hi-time">${esc(t.latest_at)}</span></div>`+
    `${bodyFold(t.bodies)}</div></article>`;
  let h = `<h2>热点榜</h2><p class="hint">热点指数 0–100（公开公式：时效 + 聚合 + 来源覆盖 + 官方置顶）· ↗↘ 趋势 = 近 24h 新增信号对比前 24h · 公式详见文档。</p>`;
  h += `<div class="cats">${['all','P0','P1','P2'].map(t => `<button class="cat-chip${hotTier===t?' on':''}" data-tier="${t}">${t==='all'?'全部':tierLabel(t)} ${t==='all'?all.length:all.filter(x=>x.tier===t).length}</button>`).join('')}</div>`;
  if(topics[0]) h += leadOf(topics[0]);
  if(topics.slice(1).length) h += `<div class="hot-list">${topics.slice(1).map(rowOf).join('')}</div>`;
  if(!topics.length) h += `<div class="empty">该分级暂无热点</div>`;
  el.innerHTML = h;
  el.querySelectorAll('[data-tier]').forEach(b => b.addEventListener('click', () => { hotTier = b.dataset.tier; renderHot(); }));
}

/* ---- 精选 ---- */
function renderCurated(){
  const el = document.getElementById('curated');
  const all = DATA.curated||[];
  const CATS = [['all','全部'],['3','资讯'],['1','公演公告'],['2','握手答谢'],['4','活动'],['5','辟谣'],['other','多团归并']];
  let curCat = 'all';
  const catOf = c => (c.catid==null ? 'other' : String(c.catid));
  const countOf = cat => cat==='all' ? all.length : all.filter(c=>catOf(c)===cat).length;
  const renderList = (list) => {
    const by = {};
    list.forEach(c=>{ (by[c.published_at] ||= []).push(c); });
    let out = '';
    Object.keys(by).sort().reverse().forEach(day=>{
      out += `<div class="day">${esc(day)}（${by[day].length} 条）</div>`;
      by[day].forEach(c=>{
        out += `<div class="news"><span class="tag ${tierTag(c.tier)}">${c.tier}</span><span class="tag grp">${esc(c.group)}</span>`+
               `<div class="h">${esc(c.title)}</div>`+
               `<div class="d">${esc(c.reason)}</div>`+
               `<div class="d"><a class="u" href="${esc(c.url)}" target="_blank" rel="noopener">原文 ↗</a></div></div>`;
      });
    });
    return out;
  };
  const renderBody = () => {
    const fp0 = all.filter(c=>c.tier==='P0' && (curCat==='all' || catOf(c)===curCat));
    const fp1 = all.filter(c=>c.tier!=='P0' && (curCat==='all' || catOf(c)===curCat));
    let out = '';
    if(fp0.length) out += `<div class="sec-ttl">🔴 P0 重点精选（${fp0.length} 条）</div>` + renderList(fp0);
    if(fp1.length) out += `<details class="fold"><summary>P1 常规精选（${fp1.length} 条，点击展开）</summary>` + renderList(fp1) + `</details>`;
    if(!fp0.length && !fp1.length) out += `<div class="empty">该分类下暂无精选</div>`;
    return out;
  };
  let h = `<h2>历史档案</h2><p class="hint">官网历史条目（2016–2019）· 排除政务公告/行政文、归并多团镜像后按 P0/P1 分级 · 默认折叠，展开后可分类浏览。</p>`;
  h += `<details class="fold"><summary>展开官网历史档案（${all.length} 条）</summary>`;
  h += `<div class="cats">` + CATS.map(([v,name])=>`<button class="cat-chip${v===curCat?' on':''}" data-cat="${v}">${name} ${countOf(v)}</button>`).join('') + `</div>`;
  h += `<div id="curated-body">` + renderBody() + `</div>`;
  h += `</details>`;
  el.innerHTML = h;
  el.querySelectorAll('.cat-chip').forEach(b=>{
    b.addEventListener('click', ()=>{
      curCat = b.dataset.cat;
      el.querySelectorAll('.cat-chip').forEach(x=>x.classList.toggle('on', x.dataset.cat===curCat));
      el.querySelector('#curated-body').innerHTML = renderBody();
    });
  });
}

/* ---- 成员事件 ---- */
function renderMemberEvents(){
  const el = document.getElementById('members');
  const roster = DATA.roster || [];
  const events = (DATA.member_events || []).filter(e => e.member && e.member !== '未指明');
  const byMember = {};
  events.forEach(e => { (byMember[e.member] ||= []).push(e); });

  const active = roster.filter(m => m.status === 'active');
  const honor  = roster.filter(m => m.status === 'honor');
  const retired = roster.filter(m => m.status === 'retired');
  const rosterNames = new Set(roster.map(m => m.name));
  const extraRetired = Object.keys(byMember).filter(n => !rosterNames.has(n));
  const statusLabel = s => s === 'active' ? '在团' : s === 'honor' ? '荣誉毕业' : '退团/离团';

  const portrait = m => m.avatar
    ? `<span class="member-portrait"><img src="${esc(m.avatar)}" alt="${esc(m.name)}" loading="lazy" onerror="this.onerror=null;this.parentElement.textContent='${esc(m.name.slice(-1))}';"></span>`
    : `<span class="member-portrait" aria-label="${esc(m.name)}">${esc(m.name.slice(-1))}</span>`;

  const eventOf = e => {
    const latest = e.latest || (e.timeline || [])[e.timeline.length - 1] || {};
    const history = (e.timeline || []).filter(t => !(t.date===latest.date && t.title===latest.title));
    return `<article class="member-event"><div class="story-head"><span class="ttl">${esc(e.event_type)}</span><span class="tag act">${e.item_count} 条</span>`+
      `<span class="meta">${esc(e.earliest_at)} - ${esc(e.latest_at)}</span></div><a class="latest-line" href="${esc(latest.url)}" target="_blank" rel="noopener">${esc(latest.title)} ↗</a>`+
      (history.length ? `<details class="editorial-fold"><summary>查看 ${history.length} 条相关动态</summary><div class="tl editorial">${history.map(t => `<div class="node"><span class="dt">${esc(t.date)}</span><span class="tag grp">${esc(t.channel)}</span><div><a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.title)}</a></div></div>`).join('')}</div></details>` : '') + `</article>`;
  };

  const radarChart = m => {
    const r = m && m.rating;
    if(!r) return '';
    const axes = [['performance','业务'],['popularity','人气'],['engagement','营业'],['charm','魅力']];
    const n = 4, cx = 90, cy = 88, R = 58;
    const pt = (i, v) => {
      const ang = -Math.PI/2 + i*2*Math.PI/n;
      const rr = R * (v/100);
      return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)];
    };
    let grid = '', spokes = '';
    for(let i=0;i<n;i++){
      const p = pt(i, 100);
      spokes += `<line x1="${cx}" y1="${cy}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
    }
    for(let lv=1; lv<=3; lv++){
      const g = axes.map((_, i) => { const p = pt(i, lv*100/3); return `${p[0].toFixed(1)},${p[1].toFixed(1)}`; }).join(' ');
      grid += `<polygon points="${g}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
    }
    const dataPts = axes.map(([k], i) => { const v = r.axes[k]; const p = pt(i, v==null?0:v); return `${p[0].toFixed(1)},${p[1].toFixed(1)}`; }).join(' ');
    const labels = axes.map(([k,label], i) => {
      const ang = -Math.PI/2 + i*2*Math.PI/n;
      const lx = cx + (R+18)*Math.cos(ang), ly = cy + (R+18)*Math.sin(ang);
      const v = r.axes[k];
      return `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" class="radar-label">${label} ${v==null?'—':v}</text>`;
    }).join('');
    return `<svg class="radar" viewBox="0 0 180 180" role="img" aria-label="能力雷达图">${grid}${spokes}<polygon points="${dataPts}" fill="var(--accent)" fill-opacity="0.22" stroke="var(--accent)" stroke-width="2"/>${labels}</svg>`;
  };

  const ratingCard = m => {
    const r = m && m.rating;
    if(!r) return '';
    const isActive = r.mode === 'current';
    const rows = [['performance','业务'],['popularity','人气'],['engagement','营业'],['charm','魅力']].map(([k,label]) => {
      const v = r.axes[k];
      let fill = v == null ? 0 : v;
      let val = v == null ? '—' : String(v);
      if(isActive && v == null) val = '待评分';
      return `<div class="rax"><span class="rname">${label}</span><div class="rbar"><span class="rfill" style="width:${fill}%"></span></div><span class="rval">${val}</span></div>`;
    }).join('');
    let head;
    if(isActive){
      const tierCls = r.tier ? ' t' + r.tier : '';
      const totalTxt = r.total == null ? `待评分 · 已有 ${r.axes_scored}/4 轴数据` : `综合 ${r.total} 分`;
      head = `<span class="tier${tierCls}">${r.total == null ? '—' : esc(r.tier)}</span><span class="rtxt">${esc(totalTxt)}</span>`;
    }else{
      head = `<span class="status-chip">${esc(r.status_label || '已离团')}</span><span class="rtxt">不参与现行评级 · 仅评生涯业务/魅力</span>`;
    }
    const note = isActive
      ? '业务/魅力/营业为编辑初评（待社区投票校正）。'
      : '已离团成员：人气/营业不再评，业务/魅力仅作生涯参考。';
    return `<div class="rating-card"><p class="module-kicker">能力评级 · ${isActive ? '当前状态' : '生涯参考'}</p>`+
      `<div class="rating-total">${head}</div>`+
      `<div class="rating-body"><div class="radar-wrap">${radarChart(m)}</div><div class="raxes">${rows}</div></div>`+
      (r.risk ? `<p class="risk-hint">⚠ ${esc(r.risk)}</p>` : '')+
      `<p class="hint">${esc(note)}</p></div>`;
  };

  const VOTE_KEY = '48hot-votes-v1';
  const LV = {1:'弱',2:'偏弱',3:'中规',4:'强',5:'顶尖'};
  const loadVotes = () => { try { return JSON.parse(localStorage.getItem(VOTE_KEY) || '{}'); } catch(e){ return {}; } };
  const saveVotes = v => { try { localStorage.setItem(VOTE_KEY, JSON.stringify(v)); } catch(e){} };
  const voteCount = v => Object.keys(v).filter(n => v[n] && Object.keys(v[n]).length).length;
  const votePanel = m => {
    if(!m) return '';
    const dims = DATA.vote_dims || [];
    const isActive = m.rating && m.rating.mode === 'current';
    const allowed = isActive ? ['performance','charm','engagement'] : ['performance','charm'];
    const byAxis = {};
    dims.filter(d => allowed.includes(d.axis)).forEach(d => { (byAxis[d.axis] ||= []).push(d); });
    const axisOrder = ['performance','charm','engagement'];
    const mine = loadVotes()[m.name] || {};
    const mkBtns = d => {
      let b = '';
      for(let l=1;l<=5;l++){
        b += `<button data-vname="${esc(m.name)}" data-vkey="${esc(d.key)}" data-vlvl="${l}" class="${mine[d.key]===l ? 'on':''}" title="${LV[l]}">${l}</button>`;
      }
      return `<div class="vote-row"><span class="vname">${esc(d.name)}</span><div class="vbtns">${b}</div></div>`;
    };
    const rows = axisOrder.filter(a => byAxis[a]).map(a =>
      `<div class="vote-axis"><p class="vote-axis-name">${esc(byAxis[a][0].axis_name)}</p>${byAxis[a].map(mkBtns).join('')}</div>`
    ).join('');
    const totalDims = dims.filter(d => allowed.includes(d.axis)).length;
    return `<div class="vote-card"><p class="module-kicker">社区投票 · 主观维度</p>`+
      `<p class="hint">打分：1 弱 · 3 中规 · 5 顶尖${isActive ? '' : '（已离团不评营业）'}。投票保存在本机，导出后交给编辑合并进评级。</p>`+
      rows+
      `<div class="vote-actions"><button class="primary" data-vact="export">导出我的投票</button><button data-vact="copy">复制投票</button><button data-vact="clear" data-vmember="${esc(m.name)}">清空 TA</button></div>`+
      `<p class="vote-count">已为 ${voteCount(loadVotes())} 位成员投票 · ${esc(m.name)} 已投 ${Object.keys(mine).length}/${totalDims} 项</p></div>`;
  };

  const keyOf = m => (m && m.sid) ? ('s' + m.sid) : ('~' + (m ? m.name : ''));
  const evidencePanel = m => {
    const evidence = (m && m.discovery_evidence) || [];
    if(!evidence.length) return `<div class="member-evidence"><p class="module-kicker">作品与成长证据</p><p class="hint">当前公开来源中还没有匹配到足够的舞台、Focus、MC 或成长记录。你可以提交可回溯证据帮助补档。</p><a class="archive-btn" href="contribute.html">为 TA 补充证据</a></div>`;
    return `<div class="member-evidence"><p class="module-kicker">作品与成长证据 · ${evidence.length} 条</p><p class="hint">以下是公开来源切片，不等同于能力排名。每条均可追溯、分享和纠错。</p><div class="slice-ledger">${evidence.map(item => `<article class="slice-entry" id="member-${esc(m.sid)}-${esc(item.id)}"><div class="slice-stamp">${statusBadge(item.verification,item.verification_label)}<strong>${esc(item.content_type_label)}</strong><time>${esc(item.date)}</time></div><div><h3><a href="${slicePage(item.id)}">${esc(item.title)}</a></h3>${item.summary?`<p>${esc(compactTitle(item.summary,140))}</p>`:''}</div><div class="slice-actions"><button class="archive-btn primary" data-share-id="${esc(item.id)}" data-share-page="members.html" data-share-title="${esc(m.name)} · ${esc(item.title)}">分享切片</button><a class="archive-btn" href="contribute.html?type=correction&slice=${esc(item.id)}">纠错</a></div></article>`).join('')}</div></div>`;
  };
  const subjectivePanel = m => m ? `<details class="editorial-fold"><summary>社区观点与能力初评（主观，不影响事实档案）</summary>${ratingCard(m)}${votePanel(m)}</details>` : '';
  const watchPanel = m => {
    if(!m) return '';
    const guide = m.watch_guide || [];
    return `<div class="member-evidence"><h3>认识${esc(m.name)}，从这里开始</h3><p class="hint">按已有官方视频整理观看顺序；以下是观看建议，尚未作唱跳能力评级。</p>${guide.length ? guide.map((item,i)=>`<article class="member-event"><p class="dossier-type">${i===0?'先看这一支':'接着看'} · ${esc(item.watch_kind)}</p><h3><a href="${esc(item.url)}" target="_blank" rel="noopener">${esc(item.title)} ↗</a></h3><p>${esc(item.watch_reason)}</p><p class="meta">官方视频来源 · ${esc(item.date)} · ${esc(item.members.join('、'))}${item.members.length>1?'（多人内容）':''}</p></article>`).join('') : '<p>还没有匹配到官方视频入口，欢迎补充舞台、直拍或 MC 的原始链接与时间段。</p>'}<a class="archive-btn" href="contribute.html?member=${encodeURIComponent(m.name)}">补充入坑片段或精彩时刻</a></div>`;
  };
  const renderDetail = key => {
    const m = key.startsWith('~') ? undefined : roster.find(x => ('s' + x.sid) === key);
    const name = m ? m.name : key.slice(1);
    const list = byMember[name] || [];
    let profile;
    if(m){
      const expItems = (m.experience || '').split('；').filter(Boolean);
      profile = `<div class="member-detail-head">${portrait(m)}<div><h3 class="member-detail-title">${esc(m.name)}</h3>`+
        `<p class="hint">${esc(statusLabel(m.status))} · ${esc(m.group)} ${esc(m.team)} · ${esc(m.generation || '')}</p>`+
        (m.concurrent && m.concurrent.length ? `<p class="hint">兼任：${esc(m.concurrent.join('、'))}</p>` : '')+
        (m.nickname ? `<p class="hint">昵称：${esc(m.nickname)}</p>` : '') + `</div></div>`+
        `<p class="module-kicker">客观事实卡 · 官网公开数据</p>`+
        `<dl class="member-facts">`+
        (m.ranking ? `<div><dt>本届名次</dt><dd>#${esc(m.ranking)}</dd></div>` : (m.best_rank ? `<div><dt>历史巅峰</dt><dd>#${esc(m.best_rank)}</dd></div>` : ''))+
        (m.departure_date ? `<div><dt>离团</dt><dd>${esc(m.departure_date)}</dd></div>` : '')+
        (m.birth_day ? `<div><dt>生日</dt><dd>${esc(m.birth_day)}</dd></div>` : '')+
        (m.star_sign_12 ? `<div><dt>星座</dt><dd>${esc(m.star_sign_12)}</dd></div>` : '')+
        (m.blood_type ? `<div><dt>血型</dt><dd>${esc(m.blood_type)}</dd></div>` : '')+
        (m.height ? `<div><dt>身高</dt><dd>${esc(m.height)}cm</dd></div>` : '')+
        (m.birth_place ? `<div><dt>出生地</dt><dd>${esc(m.birth_place)}</dd></div>` : '')+
        (m.join_day ? `<div><dt>加入</dt><dd>${esc(m.join_day)}</dd></div>` : '')+
        `<div><dt>动态提及</dt><dd>约 ${m.mentions || 0} 次</dd></div>`+
        (m.weibo_fans_str ? `<div><dt>微博粉丝</dt><dd>${esc(m.weibo_fans_str)}</dd></div>` : '')+
        (m.hobby ? `<div><dt>爱好</dt><dd>${esc(m.hobby)}</dd></div>` : '')+
        (m.speciality ? `<div><dt>特长</dt><dd>${esc(m.speciality)}</dd></div>` : '')+
        `</dl>`+
        (expItems.length ? `<details class="editorial-fold"><summary>展开完整履历 · ${expItems.length} 条</summary><div class="tl editorial">${expItems.map(t => `<div class="node">${esc(t)}</div>`).join('')}</div></details>` : '');
    }else{
      profile = `<h3 class="member-detail-title">${esc(name)}</h3><p class="hint">已不在现行官方花名册（早期退团/单飞）</p>`;
    }
    return `<div class="member-detail">${profile}${watchPanel(m)}${evidencePanel(m)}${list.length ? `<p class="module-kicker">事件链 · ${list.length} 条</p>${list.map(eventOf).join('')}` : `<p class="hint">暂无事件链记录</p>`}${subjectivePanel(m)}</div>`;
  };

  const groupOrder = ['SNH48','BEJ48','GNZ48','CKG48','CGT48','IDOLS FT'];
  const grouped = {};
  active.forEach(m => { (grouped[m.group || '其他'] ||= []).push(m); });
  const groupNames = groupOrder.filter(g => grouped[g]).concat(Object.keys(grouped).filter(g => !groupOrder.includes(g)));
  let fullRoster = false;

  const memberCard = (m, sub) => {
    const conc = (m.concurrent && m.concurrent.length) ? `<span class="tag conc" title="兼任">兼</span>` : '';
    return `<button class="member-profile" data-key="${keyOf(m)}">${portrait(m)}<span class="name">${esc(m.name)}${conc}</span><span class="count">${esc(sub || '')}</span></button>`;
  };
  const extraCard = n => `<button class="member-profile" data-key="~${esc(n)}"><span class="member-portrait" aria-label="${esc(n)}">${esc(n.slice(-1))}</span><span class="name">${esc(n)}</span><span class="count">退团/单飞</span></button>`;

  const renderGroups = q => {
    let hh = '';
    const qq = (q || '').trim().toLowerCase();
    if(qq){
      const hay = m => [m.name, m.nickname, m.generation, m.group, m.team, (m.concurrent||[]).join(' ')].join(' ').toLowerCase();
      const hit = [...active, ...honor, ...retired].filter(m => qq.split(/\s+/).every(t => hay(m).indexOf(t) >= 0));
      const ex = extraRetired.filter(n => n.toLowerCase().indexOf(qq) >= 0);
      hh += `<h3 class="member-sec-title">搜索结果 · ${hit.length + ex.length} 人</h3>`;
      hh += `<div class="member-index">${hit.map(m => memberCard(m, `${m.group} ${m.team}${m.concurrent.length ? ' · 兼'+m.concurrent.join('/') : ''}`)).join('')}${ex.map(extraCard).join('')}</div>`;
      return hh;
    }
    if(!fullRoster){
      const featured = active.slice().sort((a,b) => stableHash(`${DATA.as_of}|${a.sid}`) - stableHash(`${DATA.as_of}|${b.sid}`)).slice(0, 36);
      hh += `<p class="hint">官方花名册 · 在团 ${active.length} 人。首批成员按日期稳定轮换，不按提及量、粉丝数或指数排序；可搜索全量成员，或按团展开完整花名册。</p>`;
      hh += `<h3 class="member-sec-title">公平轮换成员 · ${featured.length}</h3><div class="member-index">${featured.map(m => memberCard(m, `${m.group} ${m.team}`)).join('')}</div>`;
      hh += `<button class="cta-btn" data-member-view="all">按团浏览全部 ${active.length} 位在团成员 →</button>`;
      return hh;
    }
    hh += `<p class="hint">官方花名册 · 在团 ${active.length} · 荣誉毕业 ${honor.length} · 退团/离团 ${retired.length + extraRetired.length} · 照片为官网公开图 · 兼任标「兼」。</p>`;
    hh += `<h3 class="member-sec-title">在团成员 · ${active.length}</h3>`;
    groupNames.forEach(g => {
      const teams = {};
      grouped[g].forEach(m => (teams[m.team || '未分队'] ||= []).push(m));
      hh += `<div class="member-group"><p class="member-group-name">${esc(g)}</p>`;
      Object.entries(teams).forEach(([team, list]) => {
        list.sort((a,b) => (a.name||'').localeCompare(b.name||'', 'zh'));
        hh += `<details class="member-team"${list.length <= 10 ? ' open' : ''}><summary class="member-team-name">${esc(team)} · ${list.length}</summary><div class="member-index">${list.map(m => memberCard(m, m.generation || '')).join('')}</div></details>`;
      });
      hh += `</div>`;
    });
    hh += `<details class="member-fold"${honor.length <= 24 ? ' open' : ''}><summary>荣誉毕业成员 · ${honor.length}</summary><div class="member-index">${honor.map(m => memberCard(m, m.team)).join('')}</div></details>`;
    const retiredCards = retired.map(m => memberCard(m, `${m.group} ${m.team}`)).join('');
    const extraCards2 = extraRetired.map(extraCard).join('');
    hh += `<details class="member-fold"><summary>退团 / 离团成员 · ${retired.length + extraRetired.length}</summary><div class="member-index">${retiredCards}${extraCards2}</div></details>`;
    return hh;
  };

  let h = `<h2>成员</h2><p class="hint">先看作品与成长证据，再看事件和主观评价。成员首批展示按日期轮换，不按声量排序。</p><div class="member-search"><input id="member-search-input" type="search" placeholder="搜成员：姓名 / 昵称 / 代际 / 团 / 队…" aria-label="搜索成员"></div><div id="member-detail"><p class="hint">点击成员卡片查看档案、作品切片与事件链。</p></div><div id="member-groups">${renderGroups('')}</div>`;
  el.innerHTML = h;
  const bindVote = () => {
    const detail = el.querySelector('#member-detail');
    bindShare(detail);
    detail.querySelectorAll('.vbtns button').forEach(b => b.addEventListener('click', () => {
      const v = loadVotes();
      (v[b.dataset.vname] ||= {})[b.dataset.vkey] = Number(b.dataset.vlvl);
      saveVotes(v);
      const m = roster.find(x => x.name === b.dataset.vname);
      const card = detail.querySelector('.vote-card');
      if(card && m) card.outerHTML = votePanel(m);
      bindVote();
    }));
    detail.querySelectorAll('[data-vact]').forEach(b => b.addEventListener('click', () => {
      const act = b.dataset.vact;
      const v = loadVotes();
      if(act === 'clear'){
        const nm = b.dataset.vmember;
        delete v[nm];
        saveVotes(v);
        const m = roster.find(x => x.name === nm);
        const card = detail.querySelector('.vote-card');
        if(card && m) card.outerHTML = votePanel(m);
        bindVote();
        return;
      }
      const js = JSON.stringify({ schema_version:'1.0.0', source:'community-vote', votes:v }, null, 2);
      if(act === 'copy'){
        if(navigator.clipboard && typeof navigator.clipboard.writeText === 'function'){
          navigator.clipboard.writeText(js).then(() => alert('已复制投票 JSON，粘贴给编辑即可合并。')).catch(() => prompt('复制失败，请手动复制：', js));
        }else{
          prompt('当前环境不支持剪贴板，请手动复制：', js);
        }
      }else{
        const blob = new Blob([js], {type:'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'votes.json';
        a.click();
        URL.revokeObjectURL(a.href);
      }
    }));
  };
  const bindMemberClicks = () => {
    el.querySelectorAll('#member-groups [data-key]').forEach(btn => btn.addEventListener('click', () => {
      el.querySelectorAll('#member-groups [data-key]').forEach(x => x.classList.toggle('on', x === btn));
      el.querySelector('#member-detail').innerHTML = renderDetail(btn.dataset.key);
      bindVote();
      el.querySelector('#member-detail').scrollIntoView({behavior:'smooth', block:'nearest'});
    }));
  };
  const bindRosterView = () => {
    const trigger = el.querySelector('[data-member-view="all"]');
    if(trigger) trigger.addEventListener('click', () => {
      fullRoster = true;
      el.querySelector('#member-groups').innerHTML = renderGroups('');
      bindMemberClicks();
    });
  };
  bindMemberClicks();
  bindRosterView();
  el.querySelector('#member-search-input').addEventListener('input', e => {
    el.querySelector('#member-groups').innerHTML = renderGroups(e.target.value);
    bindMemberClicks();
    bindRosterView();
  });

  // 供现役指数跳转：切到成员栏并直接展开对应成员档案
  window.show48Member = key => {
    window.show48Section('members');
    let card = document.querySelector(`#member-groups [data-key="${key}"]`);
    if(!card){
      fullRoster = true;
      el.querySelector('#member-groups').innerHTML = renderGroups('');
      bindMemberClicks();
      card = document.querySelector(`#member-groups [data-key="${key}"]`);
    }
    if(!card) return;
    const d = card.closest('details');
    if(d) d.open = true;
    el.querySelectorAll('#member-groups [data-key]').forEach(x => x.classList.toggle('on', x === card));
    el.querySelector('#member-detail').innerHTML = renderDetail(key);
    bindVote();
    el.querySelector('#member-detail').scrollIntoView({behavior:'smooth', block:'start'});
  };
  const memberLink = /^#member-(s?\d+)(?:-(slice-[a-z0-9]+))?$/.exec(location.hash || '');
  if(memberLink) requestAnimationFrame(() => {
    window.show48Member('s' + memberLink[1].replace(/^s/, ''));
    if(memberLink[2]) document.getElementById(location.hash.slice(1))?.scrollIntoView({block:'start'});
  });
}

/* ---- 现役成员数据指数 ---- */
function renderRanking(){
  const el = document.getElementById('rank');
  const roster = (DATA.roster || []).filter(m => m.status === 'active');
  const indexMeta = DATA.member_index || {};
  const PAGE = 24;
  let rankShown = PAGE;

  const scoreOf = m => (m.rating && typeof m.rating.rank_score === 'number') ? m.rating.rank_score : null;
  const coverageOf = m => m.rating && typeof m.rating.objective_coverage === 'number' ? m.rating.objective_coverage : 0;
  const sorted = roster.slice().sort((a,b) => {
    const sa = scoreOf(a), sb = scoreOf(b);
    if(sa == null && sb == null) return (a.name||'').localeCompare(b.name||'','zh');
    if(sa == null) return 1;
    if(sb == null) return -1;
    if(sb !== sa) return sb - sa;
    return coverageOf(b) - coverageOf(a);
  });
  const portrait = m => m.avatar
    ? `<span class="member-portrait"><img src="${esc(m.avatar)}" alt="${esc(m.name)}" loading="lazy" onerror="this.onerror=null;this.parentElement.textContent='${esc(m.name.slice(-1))}';"></span>`
    : `<span class="member-portrait" aria-label="${esc(m.name)}">${esc(m.name.slice(-1))}</span>`;

  const rowOf = (m, i) => {
    const sc = scoreOf(m);
    const coverage = coverageOf(m);
    const sub = `${esc(m.group||'')} ${esc(m.team||'')}${m.concurrent && m.concurrent.length ? ' · 兼'+esc(m.concurrent.join('/')) : ''}`;
    const conc = (m.concurrent && m.concurrent.length) ? `<span class="conc">兼</span>` : '';
    const num = i + 1;
    const cls = num <= 3 ? ` r${num}` : '';
    const scoreTxt = sc == null ? `<span class="rank-score empty">数据不足</span>` : `<span class="rank-score">${sc}</span>`;
    return `<a class="rank-row${cls}" href="members.html#member-s${esc(m.sid)}">`+
      `<span class="rank-num">${num}</span>${portrait(m)}`+
      `<span class="rank-info"><span class="rank-name">${esc(m.name)}${conc}</span><span class="rank-sub">${sub}</span></span>`+
      `<span class="rank-right">${scoreTxt}<span class="rank-coverage">数据覆盖 ${coverage}%</span></span></a>`;
  };

  const render = () => {
    const shown = sorted.slice(0, rankShown);
    const complete = sorted.filter(m => scoreOf(m) != null).length;
    const cutoff = indexMeta.as_of || DATA.as_of || '—';
    const windowDays = indexMeta.window_days || 90;
    const rankedCount = indexMeta.counts?.ranked_members ?? complete;
    let h = `<div class="rank-intro"><h2>现役成员数据指数</h2>`+
      `<p>测试版 · 仅比较现役成员的可核验数据基础，不把业务、颜值、CP 或公众投票混入排序。</p>`+
      `<div class="rank-method"><strong>当前口径：</strong>${windowDays} 天窗口，数据截至 ${esc(cutoff)}。已接入官方活动/作品、微博粉丝快照、媒体影响与跨平台覆盖；至少 60% 权重有证据才出基线值。</div></div>`;
    h += `<details class="fold"><summary>查看口径与公众参与边界</summary><p class="hint">后续公众只能参与独立的“社区观察样本”，不改写此页客观排序。对外发布前会补充多平台互动、公演/活动、数据截止日和样本审计。</p></details>`;
    h += `<div class="rank-meta">现役 ${roster.length} 人 · 当前可比较 ${rankedCount} 人 · ${complete < 20 ? '数据覆盖仍在补齐' : `已展示 ${shown.length} 人 · 点击成员查看完整事实卡。`}</div>`;
    if(complete < 20){
      h += `<div class="rank-readiness"><strong>数据建设中，暂不发布全员名次</strong><p>当前仅 ${complete} / ${roster.length} 位现役成员达到 60% 数据覆盖门槛。完成官方公演/活动、个人平台互动与跨平台证据补齐后，才会生成可公开比较的指数。</p></div>`;
      el.innerHTML = h;
      return;
    }
    h += `<div class="rank-list">${shown.map(rowOf).join('')}</div>`;
    if(shown.length < sorted.length) h += `<button class="rank-more" data-more>加载更多（+${PAGE}）</button>`;
    el.innerHTML = h;
    const more = el.querySelector('[data-more]');
    if(more) more.addEventListener('click', () => { rankShown += PAGE; render(); });
  };
  render();
}

/* ---- 成员生涯证据档案 ---- */
function renderCareer(){
  const el = document.getElementById('career');
  const career = DATA.career || {};
  const members = career.members || [];
  const meta = career.methodology || {};
  const counts = career.counts || {};
  let filter = 'all';
  const render = () => {
    const shown = members.filter(member => filter === 'all' || (filter === 'comparable' && member.comparison_eligible) || (filter === 'pocket' && (member.career_facts?.pocket_records || 0) > 0));
    let h = `<div class="career-intro"><h2>成员生涯证据档案</h2><p>从出道以来整理历史总选、官网活动存档与获许可公开的口袋48聚合记录。它是可回溯履历，不是对成员能力、人气或商业价值的总排名。</p>`+
      `<div class="career-rule"><strong>展示规则：</strong>${esc(meta.publication_rule || '证据不足时只展示档案完整度，不发布名次。')} 数据截至 ${esc(career.as_of || DATA.as_of || '—')}。</div></div>`;
    h += `<div class="career-summary"><span>成员 <b>${counts.members || members.length}</b></span><span>可比较样本 <b>${counts.comparable || 0}</b></span><span>可公开口袋记录 <b>${counts.public_pocket_records || 0}</b></span></div>`;
    h += `<div class="career-filter"><button class="${filter==='all'?'on':''}" data-career-filter="all">全部档案（${members.length}）</button><button class="${filter==='comparable'?'on':''}" data-career-filter="comparable">可比较样本（${counts.comparable || 0}）</button><button class="${filter==='pocket'?'on':''}" data-career-filter="pocket">含口袋记录（${counts.public_pocket_records || 0}）</button></div>`;
    if(!members.length){ el.innerHTML = h + `<div class="empty">生涯档案尚未构建。</div>`; return; }
    if(!shown.length){ el.innerHTML = h + `<div class="empty">该筛选暂无可公开档案。导入口袋运营方聚合导出或公开官方存档后会自动补齐。</div>`; bind(); return; }
    h += `<div class="career-list">${shown.map(member => {
      const facts = member.career_facts || {};
      const status = member.comparison_eligible ? `<span class="tag v-ok">可比较</span>` : `<span class="tag v-mid">档案建设中</span>`;
      const rank = facts.best_rank ? `历史最佳第 ${facts.best_rank} · ${facts.best_year || '—'}` : '暂无已核总选记录';
      const official = facts.official_records || 0;
      const pocket = facts.pocket_records || 0;
      return `<a class="career-row" href="members.html#member-s${esc(member.member_id)}"><span><span class="career-name">${esc(member.name || '')}</span>${status}<span class="career-sub">${esc(member.group || '')} ${esc(member.team || '')} · ${esc(member.status || '')}</span></span><span class="career-facts"><b>${esc(rank)}</b><br>官网存档 ${official} 条 · 口袋公开记录 ${pocket} 条 · 在团约 ${member.tenure_years ?? '—'} 年</span><span class="career-coverage"><b>${member.evidence_coverage || 0}%</b>证据覆盖</span></a>`;
    }).join('')}</div>`;
    el.innerHTML = h;
    bind();
  };
  const bind = () => el.querySelectorAll('[data-career-filter]').forEach(button => button.addEventListener('click', () => { filter = button.dataset.careerFilter; render(); }));
  render();
}

/* ---- 搜索 ---- */
const CH_CLS = { o:'official', m:'media', b:'bilibili', q:'bilibili-bej', n:'bilibili-gnz', u:'bilibili-cgt', d:'douban', t:'tieba', h:'tieba-hg', g:'tieba-gnz', e:'tieba-bej', k:'tieba-ckg', c:'tieba-cgt', z:'tieba-sh', w:'weibo', s:'weibo-super', p:'msg48' };
const CH_FULL = { o:'官网', m:'媒体', b:'B站', q:'BEJ48', n:'GNZ48', u:'CGT48', d:'豆瓣', t:'贴吧', h:'生个女孩吧', g:'GNZ48吧', e:'BEJ48吧', k:'CKG48吧', c:'CGT48吧', z:'塞纳河48吧', w:'微博', s:'超话', p:'口袋48/msg48' };
function runSearch(q){
  const qq = q.toLowerCase();
  const terms = [qq];
  const aliasHit = [];
  const al = DATA.search.aliases || {};
  const rv = DATA.search.rev || {};
  for(const k in al){ if(k.toLowerCase() === qq){ terms.push(al[k].toLowerCase()); aliasHit.push(k + ' → ' + al[k]); } }
  for(const name in rv){ if(name.toLowerCase() === qq){ rv[name].forEach(k => { terms.push(k.toLowerCase()); aliasHit.push(name + ' → ' + k); }); } }
  const uniq = [...new Set(terms)];
  const hits = [];
  for(const it of (DATA.search.items || [])){
    const text = ((it[2]||'') + ' ' + (it[4]||'')).toLowerCase();
    for(const t of uniq){ if(text.indexOf(t) >= 0){ hits.push(it); break; } }
  }
  hits.sort((a,b) => (b[0]||'').localeCompare(a[0]||''));
  return { hits: hits.slice(0, 50), alias: aliasHit };
}
function renderSearch(){
  const el = document.getElementById('search');
  let h = `<h2>搜索</h2><p class="hint">全量 ${DATA.search.count} 条（官网历史 + 多源）· 支持黑话：搜「水水」命中「杨冰怡」。</p>`;
  h += `<div class="search-bar"><input class="search-input" id="searchInput" placeholder="输入关键词，回车搜索…" autocomplete="off"></div>`;
  h += `<div class="search-hint" id="searchHint"></div><div id="searchResults"></div>`;
  el.innerHTML = h;
  const input = el.querySelector('#searchInput');
  const hint = el.querySelector('#searchHint');
  const res = el.querySelector('#searchResults');
  const doSearch = () => {
    const q = (input.value || '').trim();
    if(!q){ hint.innerHTML = ''; res.innerHTML = ''; return; }
    const r = runSearch(q);
    hint.innerHTML = r.alias.length ? r.alias.map(a => `<span class="search-alias">${esc(a)}</span>`).join('') : '';
    if(!r.hits.length){ res.innerHTML = `<div class="empty">无匹配，换个关键词或成员真名试试</div>`; return; }
    let out = `<div class="search-count">${r.hits.length} 条结果（时间倒序 · 最多 50）</div>`;
    r.hits.forEach(x => {
      const [date, ch, title, url, summary] = x;
      const fullUrl = url.startsWith('~') ? 'https://www.snh48.com/html/' + url.slice(1) : url;
      out += `<div class="news"><span class="ch ${CH_CLS[ch]||''}">${esc(CH_FULL[ch]||ch)}</span><span class="tag act">${esc(date)}</span>` +
        `<div class="h"><a href="${esc(fullUrl)}" target="_blank" rel="noopener">${esc(title)}</a></div>` +
        (summary ? `<div class="d">${esc(summary)}</div>` : '') + `</div>`;
    });
    res.innerHTML = out;
  };
  input.addEventListener('keyup', e => { if(e.key === 'Enter') doSearch(); });
  input.addEventListener('input', () => { if(!input.value.trim()) doSearch(); });
}

const sectionRenderers = {
  brief: renderBrief,
  discover: renderDiscover,
  clips: renderClips,

  feed: renderFeed,
  hot: renderHot,
  stories: renderStories,

  members: renderMemberEvents,
  search: renderSearch,
  picks: renderPicks,
  curated: renderCurated,
  about: renderAbout,
};
const renderedSections = new Set();
function ensureSection(id){
  if(renderedSections.has(id) || !sectionRenderers[id]) return;
  sectionRenderers[id]();
  renderedSections.add(id);
}
const initialSection = pageSection(PAGE_ID);
ensureSection(initialSection);
const requestedSection = (location.hash || '').slice(1);
if(requestedSection) requestAnimationFrame(() => {
  const target = document.getElementById(requestedSection);
  if(target){
    for(let parent=target.parentElement; parent; parent=parent.parentElement){ if(parent.tagName==='DETAILS') parent.open=true; }
    target.scrollIntoView({block:'start'});

});
if(requestedSection && document.getElementById(requestedSection)) requestAnimationFrame(() => {
